/* ═══════ ספרייה מוטמעת: Leaflet 1.9.4 — אין לערוך ═══════ */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

.form-input{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:var(--radius);
  background:var(--surface);text-align:right;font-size:16px}
.form-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light)}
.btn-primary{width:100%;background:var(--navy);color:#fff;padding:15px;border-radius:var(--radius);
  font-size:16px;font-weight:600;margin-top:18px}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--danger-light);color:#7f1d1d;font-size:14px;font-weight:500}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{background:none;padding:11px 20px;font-size:15px;font-weight:600;color:var(--text-muted);
  border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:var(--navy);border-bottom-color:var(--teal)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border);
  font-size:14px;font-weight:500;color:var(--text-muted);white-space:nowrap}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.spacer{flex:1}
.hint{font-size:12.5px;color:var(--text-muted)}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.kpi .num{font-size:28px;font-weight:800;color:var(--navy);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .label{font-size:12.5px;color:var(--text-muted);margin-top:5px}
.kpi .sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;opacity:.85}
.kpi.ok .num{color:var(--success)}.kpi.bad .num{color:var(--danger)}.kpi.warn .num{color:var(--gold-dark)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:16px}
.panel h3{font-size:15px;font-weight:700;color:var(--navy);padding:15px 18px;border-bottom:1px solid var(--border)}
.panel .body{padding:6px 0}
.panel .note{font-size:12px;color:var(--text-muted);font-weight:400;margin-right:8px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-size:12px;font-weight:600;color:var(--text-muted);padding:9px 18px;
  border-bottom:1px solid var(--border);white-space:nowrap;background:#fafbfc}
td{padding:10px 18px;border-bottom:1px solid #f1f3f6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--teal-light)}
tr.clickable td:first-child::after{content:'‹';color:var(--text-muted);margin-right:6px;font-weight:700}
.num-cell{font-variant-numeric:tabular-nums;font-weight:600}

.bar{height:7px;border-radius:999px;background:var(--border);overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;border-radius:999px;background:var(--teal)}
.bar.risk span{background:var(--danger)}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--success-light);color:#14532d}
.p-review{background:var(--gold-light);color:var(--gold-dark)}
.p-flag{background:var(--danger-light);color:#7f1d1d}
.p-none{background:var(--navy-light);color:var(--navy)}

.empty{padding:44px 20px;text-align:center;color:var(--text-muted)}
.empty .ic{font-size:40px;opacity:.45;margin-bottom:10px}
.loading{padding:60px;text-align:center;color:var(--text-muted)}

.modal-bg{position:fixed;inset:0;background:rgba(21,35,80,.45);z-index:900;display:none;
  align-items:center;justify-content:center;padding:24px 16px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:min(1180px,96vw);max-height:92vh;display:flex;flex-direction:column;
  overflow:hidden;animation:pop .15s ease-out}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px 22px;border-bottom:1px solid var(--border);background:#fafbfc}
.modal-head .t{font-size:18px;font-weight:700;color:var(--navy)}
.modal-head .s{font-size:13px;color:var(--text-muted);margin-top:3px}
.modal-x{background:var(--border);color:var(--text);width:32px;height:32px;border-radius:50%;font-size:17px;flex-shrink:0;line-height:1}
.modal-body{flex:1;min-height:0;overflow:auto}
.modal-body table{min-width:900px}
.modal-body th{position:sticky;top:0;z-index:2;background:#fafbfc;box-shadow:0 1px 0 var(--border)}
.modal-body td{white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.modal-body td.wrap{white-space:normal;max-width:260px}
.mini-kpis{flex-shrink:0}
.modal-head{flex-shrink:0}
.mini-kpis{display:flex;gap:10px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--border)}
.mini{background:var(--bg);border-radius:var(--radius-sm);padding:8px 14px;min-width:86px}
.mini .n{font-size:18px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.mini .l{font-size:11.5px;color:var(--text-muted)}

#map{height:min(60vh,600px);min-height:380px;border-radius:var(--radius);border:1px solid var(--border);background:#eef1f5}
.layer-toggles{display:flex;gap:16px;flex-wrap:wrap;padding:12px 4px 4px;font-size:13.5px}
.layer-toggles label{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text)}
.layer-toggles input{width:15px;height:15px;accent-color:var(--teal);cursor:pointer}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text-muted);padding:12px 4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:6px;vertical-align:middle}

@media (max-width:1000px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .grid2,.split{grid-template-columns:1fr}
  .container{padding:16px}
  th,td{padding:9px 12px}
}
  /* טבלת המשתמשים: רוחבים קבועים. בלעדיהם הדפדפן מחלק לפי תוכן,
     ועמודת הפעולות ותגית הסטטוס נדחסות. */
  /* רוחב טבעי לפי סכום העמודות (1204). בלי width:100% —
     חלוקה מחדש של הרוחב יצרה עודף של 2px ופס גלילה מיותר. */
  .users-table{table-layout:fixed;width:1176px;border-collapse:collapse}
  .users-table th,.users-table td{vertical-align:middle}
  .users-table .c-name  {width:150px}
  .users-table .c-id    {width:88px}
  .users-table .c-gender{width:92px}
  .users-table .c-user  {width:140px}
  .users-table .c-pass  {width:158px}
  .users-table .c-state {width:132px}
  .users-table .c-role  {width:112px}
  .users-table .c-act   {width:52px;text-align:center}
  .users-table .c-ops   {width:272px}
  .users-table .pill{white-space:nowrap;display:inline-block}
  /* **שש פעולות, שתי שורות של שלוש.** מקום קבוע לכל משבצת כדי
     שהעמודות יתיישרו בין השורות גם כשנעילה או איפוס אינם
     רלוונטיים — אחרת כל שורה בטבלה נראית אחרת.

     השורה הראשונה היא מה שעושים כל יום; השנייה היא שחזור
     והסרה, ונדירה. `הסר` אחרון ומסומן. */
  .ops-grid{display:grid;grid-template-columns:repeat(3,84px);gap:5px;justify-content:start}
  .ops-grid .chip{padding:5px 0;text-align:center;font-size:12px;white-space:nowrap}
  .ops-grid .chip.is-primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
  .ops-grid .chip.is-warm{color:var(--teal-dark);border-color:#9fd3c9;font-weight:600}
  .ops-grid .chip.is-danger{color:var(--danger);border-color:#fecaca}
  /* מקרא הפעולות — שם הכפתור ומה הוא עושה, במשפט אחד */
  .ops-legend{padding:12px 18px 16px;border-top:1px solid var(--border);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:6px 22px;
    font-size:12.5px;color:var(--text-muted)}
  .ops-legend b{color:var(--text);font-weight:600;display:inline-block;min-width:96px}
  .state-cell{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .rules-note{padding:10px 18px 0;font-size:13px;color:var(--text-muted)}
  .lock-tag{margin-inline-start:6px;white-space:nowrap}
  .lock-warn{margin-inline-start:6px;white-space:nowrap;background:var(--gold-light);color:var(--gold-dark)}
  .pw-rules{font-size:11.5px;font-weight:400;color:var(--text-muted);
    margin-top:3px;line-height:1.35;white-space:normal;max-width:210px}
  .role-tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;
    border-radius:9px;vertical-align:middle;margin-inline-start:5px}
  .role-admin{background:#152350;color:#fff}
  .role-viewer{background:#c6a636;color:#3d3000}
</style>
</head>
<body>

<header class="app-header">
  <div class="title-row">
    <div class="app-title"><span>◆</span><span>בקרת סייעים · דשבורד הנהלה</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="who" style="font-size:13px;opacity:.85"></span>
      <button class="header-btn" id="btn-logout" onclick="logout()" style="display:none">יציאה</button>
    </div>
  </div>
</header>

<section class="screen active" id="screen-login">
  <div class="container">
    <div class="login-card">
      <div class="login-icon">◆</div>
      <div class="login-title">דשבורד הנהלה</div>
      <div class="login-sub" id="login-sub">עיריית בני ברק · אגף בקרה</div>
      <div id="mode-pass" style="display:none">
        <label class="field-label" for="u">שם משתמש</label>
        <input class="form-input" id="u" autocapitalize="off" spellcheck="false">
        <label class="field-label" for="p" style="margin-top:14px">סיסמה</label>
        <input class="form-input" id="p" type="password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doLogin()">
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="chk-remember" style="width:16px;height:16px">
          <span>זכור את שם המשתמש במכשיר זה</span>
        </label>
      </div>
      <div class="err" id="err"></div>
      <button class="btn-primary" id="btn-login" onclick="doLogin()">כניסה</button>
    </div>
  </div>
</section>

<section class="screen" id="screen-main">
  <div class="container">
    <div class="tabs">
      <button class="tab active" data-t="base"    onclick="setTab('base')">מצב קיים</button>
      <button class="tab"        data-t="results" onclick="setTab('results')">תוצאות בקרה</button>
      <button class="tab"        data-t="time"    onclick="setTab('time')">פעילות מפקחים</button>
      <button class="tab"        data-t="cover"   onclick="setTab('cover')">כיסוי ומפה</button>
      <button class="tab"        data-t="users"   onclick="setTab('users')">משתמשים</button>
      <button class="tab"        data-t="audit"   onclick="setTab('audit')">ביקורת</button>
      <button class="tab"        data-t="config"  onclick="setTab('config')">הגדרות</button>
    </div>
    <div class="toolbar">
      <div id="range-chips" style="display:flex;gap:10px">
        <button class="chip" data-d="7"  onclick="setRange(7)">7 ימים</button>
        <button class="chip active" data-d="30" onclick="setRange(30)">30 יום</button>
        <button class="chip" data-d="90" onclick="setRange(90)">רבעון</button>
        <button class="chip" data-d="365" onclick="setRange(365)">שנה</button>
      </div>
      <div class="spacer"></div>
      <span class="hint" id="hidden-note"></span>
      <button class="chip" onclick="load()">רענן</button>
    </div>
    <div id="content"><div class="loading">טוען נתונים…</div></div>
  </div>
</section>

<div id="flash" style="display:none"></div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div><div class="t" id="modal-title">—</div><div class="s" id="modal-sub"></div></div>
      <button class="modal-x" onclick="closeModal()">×</button>
    </div>
    <div id="modal-kpis"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
'use strict';

const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby_m54KMPtMeNNlikGUYpCPTRRgWMDQy-3EfsVF0CkwIvmlIk1PaQljq1lJwDmYYk3J/exec',
};

/* סיווג מוסד — לא מסווגים מדגם קטן מדי */
const RULES = { MIN_CHECKS: 5, CONC_RATE: 20, CONC_ABS: 3 };

const state = { token:null, name:null, inspectorId:null, role:null, days:30, tab:'base', data:null };
const W = {};   /* מטמון לדריל דאון */

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

function fmtDur(sec){
  if(sec==null) return '—';
  const m=Math.floor(sec/60), s=Math.round(sec%60);
  return m+':'+String(s).padStart(2,'0');
}
function fmtHM(sec){
  if(sec==null) return '—';
  const h=Math.floor(sec/3600), m=Math.round(sec%3600/60);
  return h ? h+'ש '+String(m).padStart(2,'0')+'ד' : m+'ד';
}
/* השעות הן ראיה. הן חייבות להיות שעון ירושלים גם כשהדשבורד
   נפתח ממכשיר שאזור הזמן שלו אחר. */
const IL_TIME_ = new Intl.DateTimeFormat('en-GB',
  { timeZone:'Asia/Jerusalem', hour:'2-digit', minute:'2-digit', hour12:false });
function clock(v){
  if(!v) return '—';
  const d = (v instanceof Date) ? v : new Date(v);
  return isNaN(d) ? '—' : IL_TIME_.format(d);
}

const ACT_LABEL = {
  with_student_class:'צמוד לתלמיד בכיתה', with_student_out:'צמוד מחוץ לכיתה',
  nearby_available:'בקרבת התלמיד וזמין', in_class_not_student:'בכיתה, לא עם התלמיד',
  other_students:'מסייע לתלמידים אחרים', teaching:'מלמד כיתה',
  admin:'תפקיד מנהלי', idle:'לא בפעילות', other:'פעילות אחרת',
  /* הייתה חסרה. בדיקה שבה הסייע/ת שובץ/ה מחדש הציגה תא ריק —
     בדשבורד ובתיק שהולך לשימוע. חבילה 29 אוכפת כיסוי מלא. */
  reassigned:'שובץ/ה מחדש — התלמיד לא הגיע'
};
const PRES_LABEL = { found:'נמצא', not_found:'לא נמצא', substitute:'ממלא מקום',
  approved:'היעדרות מאושרת', blocked:'לא ניתן לברר' };
const STUD_LABEL = { present:'נוכח', absent:'נעדר', released:'שוחרר מוקדם', unknown:'לא ידוע' };
const VER_LABEL  = { teacher:'מחנכת', principal:'מנהל', office:'מזכירות', direct:'תצפית בלבד' };
const RECTYPE_LABEL = { check:'בדיקה', access_blocked:'סורבה כניסה',
                        gps_failed:'כשל אימות מיקום', aborted:'דיווח בוטל' };

/* ═══ API ═══ */
async function apiPost(payload){
  if(state.token) payload.token = state.token;
  if(state.inspectorId) payload.inspector = state.inspectorId;   // מי מבקש
  const r = await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(payload),
    headers:{'Content-Type':'text/plain;charset=utf-8'}});
  return r.json();
}
/* **A5:** `apiGet` הרכיב `key`, `token` ו-`inspector` במחרוזת
   השאילתה, ו-`dashboard` ו-`users` עברו בו — כלומר **טוקן של
   מנהל נסע בכתובת ה-URL**. כתובות `fetch` אינן נכנסות להיסטוריה
   ואינן נשלחות כ-Referer, ולכן זה לא ״טוקן בהיסטוריה״; מה שכן:
   הכתובת המלאה נרשמת בצד גוגל, נחשפת לכל proxy שמפענח TLS —
   נפוץ ברשתות עירוניות — ונשמרת בכל HAR.

   `apiGet` אינו נושא עוד זהות, ומשמש רק ל-`mode`. כל פעולה
   מאומתת עוברת ב-POST, שבו הזהות בגוף הבקשה. */
async function apiGet(action, params={}){
  const qs = new URLSearchParams({action, ...params});
  const r = await fetch(CONFIG.API_URL + '?' + qs);
  return r.json();
}

/* ═══ התחברות ═══ */

async function doLogin(){
  const err=$('#err'), btn=$('#btn-login');
  err.style.display='none';

  btn.disabled=true; btn.textContent='בודק סיסמה… (עד 5 שניות)';
  try{
    const r=await apiPost({action:'login', username:$('#u').value.trim(), password:$('#p').value});
    if(!r.ok) throw new Error(r.error);
    if(r.data.role!=='admin' && r.data.role!=='viewer')
      throw new Error('משתמש זה אינו מורשה לדשבורד ההנהלה');
    state.token=r.data.token; state.name=r.data.name; state.inspectorId=r.data.id; state.role=r.data.role;
    sessionStorage.setItem('bakaraDash', JSON.stringify({t:state.token,n:state.name,i:r.data.id,r:r.data.role}));
    if($('#chk-remember').checked) localStorage.setItem('bakaraDashUser', $('#u').value.trim());
    else localStorage.removeItem('bakaraDashUser');
    enter();
  }catch(e){ err.textContent=e.message||'ההתחברות נכשלה'; err.style.display='block'; }
  finally{ btn.disabled=false; btn.textContent='כניסה'; $('#p').value=''; }
}
function enter(){
  // הסתרה לנוחות בלבד. האכיפה היא בשרת: צופה שיקרא ל-users או ל-setauth ייחסם.
  const isAdmin = state.role === 'admin';
  ['users','config','audit'].forEach(t=>{
    const el=document.querySelector('.tab[data-t="'+t+'"]');
    if(el) el.style.display = isAdmin ? '' : 'none';
    if(!isAdmin && state.tab===t) state.tab='base';
  });
  $('#who').textContent = state.name + (state.role==='viewer' ? ' · צפייה בלבד' : '');
  $('#btn-logout').style.display='';
  $('#screen-login').classList.remove('active');
  $('#screen-main').classList.add('active');
  $('#range-chips').style.visibility='hidden';
  load();
}
function logout(){ sessionStorage.removeItem('bakaraDash'); location.reload(); }

function setRange(d){
  state.days=d;
  $$('.chip[data-d]').forEach(c=>c.classList.toggle('active',Number(c.dataset.d)===d));
  load();
}
function setTab(t){
  state.tab=t;
  $$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t));
  $('#range-chips').style.visibility =
    (t==='base'||t==='users'||t==='config'||t==='audit') ? 'hidden' : 'visible';
  if(state.data) render();
}

async function load(){
  $('#content').innerHTML='<div class="loading">טוען נתונים…</div>';
  try{
    const r = await apiPost({action:'dashboard', days:state.days});
    if(!r.ok) throw new Error(r.error);
    state.data=r.data;
    const T=r.data.totals||{};
    const bits=[];
    if(T.hidden_tests) bits.push(T.hidden_tests+' רשומות בדיקה מוסתרות');
    if(!T.auth_on)     bits.push('⚠ אימות סיסמה כבוי');
    /* התאמת מזהי נוכחות. כשל נרמול נראה כמו "אף אחד לא החתים",

       ״לא נמצא״. אותה משפחת כשל של התאמת המזהים — המנגנון
       משתתק בשקט ונראה כאילו הוא עובד. */

                  T.work_window_pct < 80;

      (T.work_window_counts ? ' (' + T.work_window_counts + ')' : '') +
      ' — סינון חלון העבודה אינו פועל על השאר');

    /* **ממצא 6 (ביקורת 4).** work_window_pct הוא 100% במבנה:
       הסנכרון דוחה שורה בלי שעות, ולכן הוא מודד את מה שהכותב
       כבר מבטיח. work_days הוא השדה שאבד בממצא 2׳ ושבהיעדרו
       סינון הימים משתתק — וזה מה שצריך למדוד. */

                  T.work_days_pct < 80;
    if(wdBad) bits.push('⚠ ימי עבודה ברוסטר: ' + T.work_days_pct + '%' +
      (T.work_days_counts ? ' (' + T.work_days_counts + ')' : '') +
      ' — סינון ימי העבודה אינו פועל על השאר; אפס פירושו שהוא מת');

    /* **ממצא 5 (ביקורת חיצונית).** עמודת "ימי עבודה" בעברית היא
       גם הכותרת הטבעית ל*מספר* ימי העבודה בשבוע. ערך בן ספרה
       אחת בכל שורה פירושו שהעמודה כנראה מונה, והסינון מוציא

    if(wdShape) bits.push('⚠ ' + wdSingle + '% מערכי ימי העבודה הם ספרה אחת — ' +
      'ייתכן שהעמודה היא מספר ימים בשבוע ולא קבוצת ימים; הסינון מוציא סייעים בשגגה');

    /* תאי תאריך שלא ניתן לפרש. שורה כזו נעלמת מכל השוואה —
       אינה נספרת, אינה מוצלבת, ואינה מפילה דבר. */
    if(T.bad_dates) bits.push('⚠ תאי תאריך שאינם קריאים: ' + T.bad_dates +
      ' — שורות אלה אינן נספרות בשום מקום');

    /* **ממצא 16':** הטריגר היומי נושא שלוש חובות — מדדים, מחיקת
       קואורדינטות, וניקוי סשנים וניסיונות — ואין מקום שמדווח אם
       הוא מותקן בכלל. פרויקט שהטריגרים בו נמחקו בפריסה מחדש
       ממשיך לעבוד בדיוק כרגיל, בעוד הקואורדינטות אינן נמחקות
       לעולם בניגוד למדיניות שהוצהרה. הכשל שקט לחלוטין. */
    const staleH = iso => {
      if(!iso) return Infinity;
      const t = new Date(iso).getTime();
      return isNaN(t) ? Infinity : (Date.now() - t) / 3600000;
    };
    const runH = staleH(T.daily_run_at), purgeH = staleH(T.purge_run_at);
    const trigBad = runH > 48 || purgeH > 48;
    if(trigBad) bits.push('⚠ הטריגר היומי: ' +
      (T.daily_run_at ? 'מדדים לפני ' + Math.round(runH) + ' שעות' : 'מדדים — לא רץ מעולם') +
      ' · ' +
      (T.purge_run_at ? 'מחיקת מיקום לפני ' + Math.round(purgeH) + ' שעות'
                      : 'מחיקת מיקום — לא רצה מעולם') +
      ' — הרץ installDailyMetrics');

    /* דיווחים שנאספו בשטח ולא נשלחו. הם קיימים רק על המכשיר,
       ואיפוס דפדפן מוחק אותם — ולכן זו אזהרה ולא הערה. */
    const stuck = T.queue_stuck || [];
    if(stuck.length){
      const total = stuck.reduce((s,x)=>s+x.pending,0);
      bits.push('⚠ ' + total + ' דיווחים ממתינים על מכשירי מפקחים: ' +
        stuck.map(x=>esc(x.name) + ' (' + x.pending + ')').join(', ') +
        ' — ראיה שלא נשלחה קיימת רק על המכשיר');
    }
    $('#hidden-note').innerHTML = bits.join(' · ');
    const bad = idBad || wwBad || wdBad || wdShape || !!T.bad_dates || trigBad;
    $('#hidden-note').style.color = (!T.auth_on || bad) ? 'var(--danger)' : '';
    $('#hidden-note').style.fontWeight = bad ? '700' : '';
    render();
  }catch(e){
    $('#content').innerHTML='<div class="panel"><div class="empty"><div class="ic">⚠</div>'+esc(e.message)+'</div></div>';
  }
}

/* ═══ דריל דאון ═══ */
function openModal(title, sub, kpis, html){
  $('#modal-title').textContent=title;
  $('#modal-sub').textContent=sub||'';
  $('#modal-kpis').innerHTML = (kpis&&kpis.length)
    ? '<div class="mini-kpis">'+kpis.map(k=>`<div class="mini"><div class="n">${esc(k.n)}</div><div class="l">${esc(k.l)}</div></div>`).join('')+'</div>' : '';
  $('#modal-body').innerHTML=html;
  $('#modal-bg').classList.add('show');
}
/* ממצא 11: הערך נקרא מ-dataset ולא מוזרק לתוך מחרוזת JS בתוך HTML.
   esc() ממיר גרש ל-&#39;, ומפענח ה-HTML היה מחזיר אותו לגרש לפני
   שה-JS נקרא — כך ששם עם גרש שבר את השורה, ושם זדוני הריץ קוד. */
document.addEventListener('click', e => {
  const tr = e.target.closest('[data-drill]');
  if (!tr) return;
  const v = tr.dataset.v || '';
  switch (tr.dataset.drill) {
    case 'count':      return drillCount(tr.dataset.k, v, tr.dataset.inst === 'true');
    case 'instRoster': return drillInstRoster(v);
    case 'inspector':  return drillInspector(v);
    case 'institution':return drillInstitution(v);
    case 'activity':   return drillActivity(v);
    case 'type':       return drillType(v);
    case 'month':      return drillMonth(v);
    case 'assistant':  return drillAssistant(v);
    case 'inspDays':   return drillInspDays(v);
    case 'dossier':    return openDossier(tr.dataset.kind, tr.dataset.id);
    case 'day':        return drillDay(Number(tr.dataset.i));
    case 'dayF':       return drillDayF(Number(tr.dataset.i));
  }
});

function closeModal(){ $('#modal-bg').classList.remove('show'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* תפקיד הבודק — מנהל שבודק בעצמו מסומן, כדי שיהיה ברור מי ביצע מה */
function staffRole(name){
  const st=(state.data&&state.data.staff)||[];
  const m=st.filter(s=>s.name===name)[0];
  return m ? m.role : null;
}
function roleTag(name){
  const r=staffRole(name);
  if(r==='admin')  return ' <span class="role-tag role-admin">מנהל</span>';
  if(r==='viewer') return ' <span class="role-tag role-viewer">צופה</span>';
  return '';
}

/* groupBy — קיבוץ לפי פונקציה ולא לפי שם שדה.
   ממצא 15: ההצלבה נעשתה לפי שם. שני סייעים בעלי אותו שם התמזגו
   לרשומה אחת, ושינוי כתיב פיצל היסטוריה. המזהה הוא המפתח.
   הנרמול זהה ל-normId_ בשרת: אפסים מובילים יורדים כשהערך כולו
   ספרות — ת"ז שהגיליון קלט כמספר איבדה אפס מוביל בצד אחד. */
function nid(v){
  const t=String(v===undefined||v===null?'':v).trim();
  return /^\d+$/.test(t) ? String(Number(t)) : t;
}

function groupBy(arr,fn){
  const m={}; arr.forEach(x=>{const k=fn(x)||'—';(m[k]=m[k]||[]).push(x);}); return m;
}

function group(arr,key){
  const m={}; arr.forEach(x=>{const k=x[key]||'—';(m[k]=m[k]||[]).push(x);}); return m;
}

function rosterTable(list){
  if(!list.length) return '<div class="empty">אין רשומות</div>';
  const C=state.data.checks;
  return `<table><thead><tr>
    <th>שם הסייע</th><th>ת.ז</th><th>סוג</th><th>מוסד</th><th>תלמיד</th><th>כיתה</th><th>נבדק</th>
  </tr></thead><tbody>${list.map(r=>{
    const a=C.filter(c=>nid(c.aid)===nid(r.aid));
    const f=a.filter(c=>c.verdict==='flag').length;
    return `<tr><td>${esc(r.name)}</td><td class="num-cell">${esc(r.aid)}</td>
      <td>${esc(r.atype)}</td><td>${esc(r.institution)}</td>
      <td>${esc(r.student)}</td><td>${esc(r.klass)}</td>
      <td>${a.length ? (f?`<span class="pill p-flag">${a.length} · ${f} חריגות</span>`
                         :`<span class="pill p-ok">${a.length} תקין</span>`)
                     : '<span class="pill p-none">טרם נבדק</span>'}</td></tr>`;
  }).join('')}</tbody></table>`;
}

function checksTable(list){
  if(!list.length) return '<div class="empty">אין בדיקות</div>';
  const vp=v=>v==='flag'?'<span class="pill p-flag">חריגה</span>'
           :v==='review'?'<span class="pill p-review">לבדיקה חוזרת</span>'
           :'<span class="pill p-ok">תקין</span>';
  return `<table><thead><tr>
    <th>תאריך</th><th>מפקח</th><th>מוסד</th><th>סייע</th><th>סוג</th>
    <th>מצב</th><th>פעילות</th><th>תלמיד</th><th>אימות</th><th>תוצאה</th>
  </tr></thead><tbody>${list.slice().reverse().map(c=>{
    /* ממצא 27: הטקסט החופשי שהמפקח כתב לא הוצג כלל. ממצא בלי
       הנימוק שנכתב בשטח אינו ראיה, וזה בדיוק מה שנדרש בשימוע. */
    const notes=[c.notes,c.presence_text,c.activity_text,c.student_text]
      .map(x=>String(x||'').trim()).filter(Boolean);
    return `<tr>
    <td style="white-space:nowrap">${esc(c.date)}</td>
    <td style="white-space:nowrap">${esc(c.inspector)}</td>
    <td>${esc(c.institution)}</td>
    <td style="white-space:nowrap">${esc(c.assistant)}</td>
    <td style="white-space:nowrap">${esc(c.atype)}</td>
    <td style="white-space:nowrap">${esc(PRES_LABEL[c.presence]||c.presence)}</td>
    <td class="wrap">${esc(ACT_LABEL[c.activity]||'—')}</td>
    <td style="white-space:nowrap">${esc(STUD_LABEL[c.student_status]||'—')}</td>
    <td style="white-space:nowrap">${esc(c.verified_name||VER_LABEL[c.verified_by]||'—')}</td>
    <td>${vp(c.verdict)}</td></tr>` + (notes.length ? `<tr class="note-row">
    <td colspan="10" style="background:var(--bg);color:var(--text-muted);font-size:13px;
        padding:6px 12px 10px;border-top:0">
      <b style="color:var(--navy)">מה נרשם בשטח:</b> ${notes.map(esc).join(' · ')}</td>
  </tr>` : '');}).join('')}</tbody></table>`;
}

function drillChecks(title, sub, list){
  const f=list.filter(c=>c.verdict==='flag').length;
  const r=list.filter(c=>c.verdict==='review').length;
  const nf=list.filter(c=>c.presence==='not_found').length;
  openModal(title, sub, [
    {n:list.length,l:'בדיקות'},{n:f,l:'חריגות'},{n:r,l:'לבדיקה חוזרת'},
    {n:nf,l:'לא נמצא'},{n:new Set(list.map(c=>nid(c.aid)||c.assistant)).size,l:'סייעים'},
    {n:new Set(list.map(c=>c.institution)).size,l:'מוסדות'}
  ], checksTable(list));
}

function countPanel(key, arr, title, note){
  const g=group(arr,key);
  const rows=Object.keys(g).map(k=>({k,n:g[k].length})).sort((a,b)=>b.n-a.n);
  const tot=arr.length, max=Math.max(...rows.map(r=>r.n),1);
  W['g_'+key]=g;
  const isInst = arr===W.instAll;
  return `<div class="panel"><h3>${title}${note?' <span class="note">'+note+'</span>':''}</h3>
    <div class="body" style="max-height:340px;overflow-y:auto"><table><tbody>${rows.map(r=>`<tr class="clickable"
      data-drill="count" data-k="${esc(key)}" data-v="${esc(r.k)}" data-inst="${isInst}">
      <td style="width:38%">${esc(r.k)}</td>
      <td class="num-cell" style="width:44px">${r.n}</td>
      <td class="num-cell" style="width:46px;color:var(--text-muted);font-size:12px">${pct(r.n,tot)}%</td>
      <td><div class="bar"><span style="width:${r.n/max*100}%"></span></div></td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

     לפי **מזהה**: שתי סייעות באותו שם התמזגו במונה, ושינוי כתיב

function inspectorPanel(C){
  const g=group(C,'inspector');
  const rows=Object.keys(g).map(k=>{
    const a=g[k], f=a.filter(c=>c.verdict==='flag').length;
    const days=new Set(a.map(c=>c.date)).size;
    const visits=new Set(a.map(c=>c.date+'|'+c.institution)).size;
    return {name:k,n:a.length,visits,days,perDay:(a.length/Math.max(days,1)).toFixed(1),
            flagRate:pct(f,a.length),avg:a.reduce((s,c)=>s+c.t_report,0)/a.length};
  }).sort((x,y)=>y.n-x.n);
  return `<div class="panel"><h3>מפקחים
      <span class="note">״בדיקות״ = סייעים שנבדקו · 0% חריגות חשוד לא פחות משיעור גבוה</span></h3>
    <div class="body"><table><thead><tr>
      <th>מפקח</th><th>ימים</th><th>ביקורים</th><th>בדיקות</th><th>ליום</th><th>% חריגות</th><th>זמן דיווח</th>
    </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-drill="inspector" data-v="${esc(r.name)}">
      <td>${esc(r.name)}${roleTag(r.name)}</td><td class="num-cell">${r.days}</td><td class="num-cell">${r.visits}</td>
      <td class="num-cell">${r.n}</td><td class="num-cell">${r.perDay}</td>
      <td class="num-cell" style="color:${r.flagRate>25?'var(--danger)':r.flagRate===0?'var(--gold-dark)':'inherit'}">${r.flagRate}%</td>
      <td class="num-cell">${fmtDur(r.avg)}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}
function drillInspector(name){
  drillChecks(name,'כל הבדיקות בטווח',state.data.checks.filter(c=>c.inspector===name));
}

function classify(n,f){
  if(n<RULES.MIN_CHECKS) return {t:'מדגם קטן',c:'p-none'};
  if(f===0) return {t:'תקין',c:'p-ok'};
  if(f>=RULES.CONC_ABS && pct(f,n)>=RULES.CONC_RATE) return {t:'ריכוז ממצאים',c:'p-flag'};
  return {t:'ממצאים',c:'p-review'};
}

function institutionResultPanel(C,I){
  const g=group(C,'institution');
  const rows=Object.keys(g).map(k=>{
    const a=g[k], f=a.filter(c=>c.verdict==='flag').length;
    return {name:k,n:a.length,f,rate:pct(f,a.length),cls:classify(a.length,f)};
  }).sort((x,y)=>y.rate-x.rate||y.n-x.n);
  const never=I.filter(i=>!g[i.name]).length;
  return `<div class="panel"><h3>מוסדות לפי תוצאה
      <span class="note">${never} טרם נבדקו · ״ריכוז ממצאים״ = ${RULES.CONC_ABS}+ חריגות וגם ${RULES.CONC_RATE}%+, ורק מ-${RULES.MIN_CHECKS} בדיקות</span></h3>
    <div class="body" style="max-height:420px;overflow-y:auto"><table><thead><tr>
      <th>מוסד</th><th>בדיקות</th><th>חריגות</th><th style="width:96px">שיעור</th><th>סטטוס</th>
    </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-drill="institution" data-v="${esc(r.name)}">
      <td>${esc(r.name)}</td><td class="num-cell">${r.n}</td><td class="num-cell">${r.f}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="bar ${r.rate?'risk':''}"><span style="width:${r.rate}%"></span></div>
        <span class="num-cell" style="font-size:12px">${r.rate}%</span></div></td>
      <td><span class="pill ${r.cls.c}">${r.cls.t}</span></td>
    </tr>`).join('')}</tbody></table></div></div>`;
}
function drillInstitution(name){
  drillChecks(name,'כל הבדיקות במוסד',state.data.checks.filter(c=>c.institution===name));
}

function activityPanel(C){

/* מגמה חודשית — המספר שמוכיח אם הבקרה משנה התנהגות */
function trendPanel(C){
  const g={};
  C.forEach(c=>{ const m=c.date.slice(0,7); (g[m]=g[m]||[]).push(c); });
  const months=Object.keys(g).sort();
  if(months.length<2) return `<div class="panel"><h3>מגמה חודשית</h3>
    <div class="empty">נדרשים לפחות חודשיים של בדיקות</div></div>`;
  const rows=months.map(m=>{
    const a=g[m], f=a.filter(c=>c.verdict==='flag').length;
    return {m,n:a.length,f,rate:pct(f,a.length)};
  });
  const max=Math.max(...rows.map(r=>r.rate),1);
  const first=rows[0].rate, last=rows[rows.length-1].rate;
  const dir = last<first ? {t:'ירידה של '+(first-last)+' נק׳ אחוז',c:'var(--success)'}
            : last>first ? {t:'עלייה של '+(last-first)+' נק׳ אחוז',c:'var(--danger)'}
            : {t:'ללא שינוי',c:'var(--text-muted)'};
  return `<div class="panel"><h3>מגמת חריגות לפי חודש
      <span class="note" style="color:${dir.c};font-weight:600">${dir.t} מתחילת התקופה</span></h3>
    <div class="body"><table><thead><tr>
      <th>חודש</th><th>בדיקות</th><th>חריגות</th><th style="width:44%">שיעור</th>
    </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-drill="month" data-v="${esc(r.m)}">
      <td class="num-cell">${r.m}</td><td class="num-cell">${r.n}</td><td class="num-cell">${r.f}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="bar ${r.rate?'risk':''}"><span style="width:${r.rate/max*100}%"></span></div>
        <span class="num-cell" style="font-size:12px">${r.rate}%</span></div></td>
    </tr>`).join('')}</tbody></table></div></div>`;
}
function drillMonth(m){
  drillChecks(m,'כל הבדיקות בחודש',state.data.checks.filter(c=>c.date.slice(0,7)===m));
}

/* ביקורות חוזרות — האם אחרי ממצא בוצעה בדיקה נוספת, ומה קרה בה */
function recheckPanel(C){
  const byA=groupBy(C,c=>nid(c.aid)||c.assistant);
  const rows=[];
  Object.keys(byA).forEach(key=>{
    const a=byA[key].slice().sort((x,y)=>x.date.localeCompare(y.date));
    const name=a[0].assistant;
    a.forEach((c,i)=>{
      if(c.verdict!=='flag') return;
      const next=a.slice(i+1).find(x=>x.date>c.date);
      const days=next?Math.round((new Date(next.date)-new Date(c.date))/86400000):null;
      /* **ממצא 13':** השורה שלחה `name` ו-`drillAssistant` מסנן
         לפי מזהה — כל לחיצה פתחה חלון ריק. `assistantPanel`
         באותו קובץ עושה זאת נכון. זהו הפאנל שעוקב אחרי מה קרה
         אחרי ממצא, כלומר המסך שנדרש לפני החלטה משמעתית. */
      rows.push({key,name,inst:c.institution,date:c.date,next:next?next.date:null,days,
                 result:next?next.verdict:null});
    });
  });
  if(!rows.length) return `<div class="panel"><h3>ביקורות חוזרות</h3>
    <div class="empty">אין עדיין חריגות למעקב</div></div>`;
  const none=rows.filter(r=>!r.next).length;
  const fixed=rows.filter(r=>r.result==='ok').length;
  const again=rows.filter(r=>r.result==='flag').length;
  const st=r=>!r.next?'<span class="pill p-none">טרם נבדק שוב</span>'
        :r.result==='flag'?'<span class="pill p-flag">חריגה חוזרת</span>'
        :r.result==='review'?'<span class="pill p-review">לבדיקה</span>'
        :'<span class="pill p-ok">תקין בבדיקה חוזרת</span>';
  return `<div class="panel"><h3>ביקורות חוזרות אחרי ממצא
      <span class="note">${fixed} תוקנו · ${again} חזרו · ${none} טרם נבדקו שוב</span></h3>
    <div class="body" style="max-height:400px;overflow:auto"><table><thead><tr>
      <th>סייע</th><th>מוסד</th><th>הממצא</th><th>נבדק שוב</th><th>אחרי</th><th>תוצאה</th>
    </tr></thead><tbody>${rows.slice(0,60).map(r=>`<tr class="clickable" data-drill="assistant" data-v="${esc(r.key)}">
      <td>${esc(r.name)}</td><td>${esc(r.inst)}</td><td class="num-cell">${r.date}</td>
      <td class="num-cell">${r.next||'—'}</td>
      <td class="num-cell">${r.days!=null?r.days+' ימים':'—'}</td><td>${st(r)}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

/* **ממצא 21':** רשומות `access_blocked` ו-`gps_failed` התקבלו גם
   בלי `assignment_id`, ואז `institution_name` ריק. בפאנל שהוגדר
   ״האות החזק ביותר להתארגנות מוסדית״, שורה בלי מוסד היא רעש
   שנספר. השרת דורש עכשיו שיגור לשני הסוגים; זו הגנה לרשומות
   שכבר נכתבו. */
function withInst(rows){ return (rows||[]).filter(r=>String(r.institution||'').trim()); }

  if(!B.length) return '';
  const g=group(B,'institution');

/* ממצא 13: כשל GPS הוא תקלה טכנית אצל המפקח, לא התנגדות של
   מוסד. כשהוא נספר יחד עם סירובי הכניסה, מכשיר ישן נראה כמו

/* ממצא 31: מוסד בלי קואורדינטות, או שאין מפקח למגזר שלו, נופל
   מבריכת ההגרלה לצמיתות — בשקט. הוא פשוט לא ייבדק לעולם, ואיש
   לא יידע. אותה משפחת כשל כמו נרמול המזהים. */

/* ביטולים אחרי חשיפה. הנתון ישב בגיליון מהיום הראשון ואיש לא
   קרא אותו — וזו הפעולה שמאפשרת למפקח לא לבדוק שם שקיבל.
   ריכוז אצל מפקח אחד הוא בדיוק מה שצריך להיראות. */

    </tr></thead><tbody>${rows.map(r=>`<tr>

      <td class="wrap" style="font-size:13px;color:var(--text-muted)">${
        [...new Set(r.rows.map(x=>x.notes).filter(Boolean))].map(esc).join(' · ')||'—'}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

function gpsFailedPanel(){

    <div class="body"><table><thead><tr><th>מפקח</th><th>מקרים</th><th>מוסדות</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.k)}</td><td class="num-cell">${r.n}</td>

    </tr>`).join('')}</tbody></table></div></div>`;

function assistantPanel(C){
  const g=groupBy(C,c=>nid(c.aid)||c.assistant);
  const rows=Object.keys(g).map(k=>{
    const a=g[k], f=a.filter(c=>c.verdict==='flag').length;
    /* **ממצא 22':** `inst` נלקח מהבדיקה הראשונה בלבד. סייעת
       המשובצת לשני מוסדות הוצגה תחת אחד מהם, וההחלטה למי לפנות
       נשענה על שדה שגוי במחצית המקרים. */
    const insts=[...new Set(a.map(c=>c.institution).filter(Boolean))];
    return {key:k,name:a[0].assistant,insts,atype:a[0].atype,n:a.length,f,
            nf:a.filter(c=>c.presence==='not_found').length};
  }).filter(r=>r.f>0).sort((a,b)=>b.f-a.f||b.n-a.n).slice(0,40);
  if(!rows.length) return '';
  const rep=rows.filter(r=>r.f>=2).length;
  return `<div class="panel"><h3>סייעים עם חריגות
      <span class="note">${rep} עם יותר מחריגה אחת — אלה שדורשים טיפול, לא מקרה חד-פעמי</span></h3>

      <th>שם הסייע</th><th>סוג</th><th>מוסד</th><th>בדיקות</th><th>לא נמצא</th><th>חריגות</th><th></th>
    </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-drill="assistant" data-v="${esc(r.key)}">
      <td>${esc(r.name)}</td><td>${esc(r.atype)}</td><td>${r.insts.length>1
        ? `<span title="${esc(r.insts.join(' · '))}">${r.insts.length} מוסדות</span>`
        : esc(r.insts[0]||'—')}</td>
      <td class="num-cell">${r.n}</td><td class="num-cell">${r.nf}</td>
      <td class="num-cell" style="color:${r.f>=2?'var(--danger)':'inherit'}">${r.f}</td>
      <td>${dossierBtn('assistant', r.key)}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}
function drillAssistant(key){

/* ══════ פעילות מפקחים ══════ */
function buildDays(C){
  const t=x=>{ if(!x) return null; const d=new Date(x); return isNaN(d)?null:d.getTime(); };
  const byDay={};
  C.forEach(c=>{
    const k=c.inspector+'|'+c.date;
    (byDay[k]=byDay[k]||{inspector:c.inspector,date:c.date,checks:[]}).checks.push(c);
  });
  return Object.values(byDay).map(d=>{
    const ch=d.checks.slice().sort((a,b)=>(t(a.arrival_time)||0)-(t(b.arrival_time)||0));
    const first=t(ch[0].dispatch_time)||t(ch[0].arrival_time);
    const last =t(ch[ch.length-1].close_time)||t(ch[ch.length-1].arrival_time);
    const visits=[]; let cur=null;
    ch.forEach(c=>{
      if(!cur||cur.institution!==c.institution){
        cur={institution:c.institution,dispatch:t(c.dispatch_time),arrive:t(c.arrival_time),
             end:t(c.close_time),n:1,flags:c.verdict==='flag'?1:0,checks:[c]};
        visits.push(cur);
      } else {
        cur.end=t(c.close_time)||cur.end; cur.n++; cur.checks.push(c);
        if(c.verdict==='flag') cur.flags++;
      }
    });
    let onSite=0, travel=0;
    visits.forEach((v,i)=>{
      if(v.arrive&&v.end) onSite+=(v.end-v.arrive)/1000;
      if(i>0&&visits[i-1].end&&v.arrive) travel+=Math.max(0,(v.arrive-visits[i-1].end)/1000);
    });
    const span=(first&&last&&last>first)?(last-first)/1000:null;
    return {...d,checks:ch,visits,span,onSite,travel,
            gap: span!=null ? Math.max(0,span-onSite-travel) : null};
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

function renderTime(){
  const C=state.data.checks.filter(c=>c.arrival_time&&c.close_time);
  if(!C.length){
    $('#content').innerHTML='<div class="panel"><div class="empty"><div class="ic">◷</div>'+
      '<div style="font-weight:600;color:var(--navy);font-size:17px">אין נתוני זמנים בטווח</div>'+
      '<div style="margin-top:8px">נדרשות בדיקות עם חותמות הגעה וסגירה</div></div></div>';
    return;
  }
  const days=buildDays(C);
  W.days=days;
  const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
  const avgSpan=sum(days,d=>d.span)/days.length;
  const avgSite=sum(days,d=>d.onSite)/days.length;
  const avgTrav=sum(days,d=>d.travel)/days.length;
  const avgGap =sum(days,d=>d.gap)/days.length;

  /* הציפייה מגיעה מגיליון ההגדרות ומוצגת בלבד. אין חסימה בשרת
     על אורך יום או על מספר בדיקות — הדבר היחיד שנחסם הוא
     שיגורים שלא הבשילו להגעה. */
  const expH=Number((state.data.totals||{}).expected_workday_hours)||0;

  /* יעדים שנפתחו ולא הסתיימו בהגעה. אלה אינם מופיעים בבדיקות —
     אין להם רשומה — ולכן הם מגיעים בנפרד משורות השיגור. */
  const DS=(state.data.dispatch_stats||[]);
  const dsByInsp={};
  DS.forEach(d=>{
    const k=d.name||d.id;
    const a=dsByInsp[k]||(dsByInsp[k]={forfeited:0,abandoned:0,total:0});
    a.forfeited+=d.forfeited||0; a.abandoned+=d.abandoned||0; a.total+=d.total||0;
  });

  const byInsp=group(days,'inspector');
  const rows=Object.keys(byInsp).map(k=>{
    const a=byInsp[k];
    const span=sum(a,d=>d.span), site=sum(a,d=>d.onSite),
          trav=sum(a,d=>d.travel), gap=sum(a,d=>d.gap);
    const visits=sum(a,d=>d.visits.length), checks=sum(a,d=>d.checks.length);
    const hops=Math.max(visits-a.length,0);
    const ds=dsByInsp[k]||{forfeited:0,abandoned:0};
    /* המזהה, ולא השם, הוא מה שפותח תיק. שני מפקחים בעלי אותו שם
       היו פותחים את אותו תיק. */
    const sid=(state.data.staff||[]).filter(x=>x.name===k)[0];
    return {name:k,id:sid?sid.id:'',days:a.length,span,site,trav,gap,visits,checks,
      avgSpan:span/a.length, avgVisit:visits?site/visits:0, avgHop:hops?trav/hops:null,
      util:span?Math.round(site/span*100):0,
      forfeited:ds.forfeited, abandoned:ds.abandoned};
  }).sort((a,b)=>b.days-a.days);

  $('#content').innerHTML = `<div class="kpi-row">
    <div class="kpi"><div class="num">${days.length}</div><div class="label">ימי עבודה</div>
      <div class="sub">${Object.keys(byInsp).length} מפקחים</div></div>
    <div class="kpi ${expH && avgSpan < expH*3600000*0.8 ? 'warn' : ''}">
      <div class="num">${fmtHM(avgSpan)}</div><div class="label">אורך יום ממוצע</div>
      <div class="sub">${expH ? 'מצופה ' + expH + ' שעות · ' + pct(avgSpan, expH*3600000) + '%'
                              : 'מהשיגור הראשון לדיווח האחרון'}</div></div>
    <div class="kpi ok"><div class="num">${fmtHM(avgSite)}</div><div class="label">זמן במוסדות</div>
      <div class="sub">${pct(avgSite,avgSpan)}% מהיום</div></div>
    <div class="kpi warn"><div class="num">${fmtHM(avgTrav)}</div><div class="label">נסיעה בין מוסדות</div>
      <div class="sub">${pct(avgTrav,avgSpan)}% מהיום</div></div>
    <div class="kpi ${avgGap>avgSpan*0.35?'bad':''}"><div class="num">${fmtHM(avgGap)}</div>
      <div class="label">זמן בלתי מוסבר</div>
      <div class="sub">${pct(avgGap,avgSpan)}% — הפסקות וזמן מת</div></div>
  </div>
  <div class="panel"><h3>סיכום לפי מפקח
      <span class="note">ניצול = זמן במוסדות חלקי אורך היום · ויתור = יעד ששוחרר לפני הגעה ·
        ננטש = יעד שנפתח ופקע בלי הגעה${expH ? ' · אורך יום מצופה: ' + expH + ' שעות' : ''} ·
        לחץ לפירוט יומי</span></h3>
    <div class="body" style="overflow-x:auto"><table><thead><tr>
      <th>מפקח</th><th>ימים</th><th>ביקורים</th><th>בדיקות</th><th>אורך יום</th>
      <th>שהייה במוסד</th><th>נסיעה בין מוסדות</th><th>לא מוסבר ליום</th><th>ניצול</th>
      <th>ויתורים</th><th>ננטשו</th><th></th>
    </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-drill="inspDays" data-v="${esc(r.name)}">
      <td>${esc(r.name)}${roleTag(r.name)}</td><td class="num-cell">${r.days}</td>
      <td class="num-cell">${r.visits}</td><td class="num-cell">${r.checks}</td>
      <td class="num-cell">${fmtHM(r.avgSpan)}</td>
      <td class="num-cell">${fmtHM(r.avgVisit)}</td>
      <td class="num-cell">${fmtHM(r.avgHop)}</td>
      <td class="num-cell">${fmtHM(r.gap/r.days)}</td>
      <td class="num-cell" style="color:${r.util<40?'var(--danger)':r.util>70?'var(--success)':'inherit'}">${r.util}%</td>
      <td class="num-cell">${r.forfeited||'—'}</td>
      <td class="num-cell" style="color:${r.abandoned?'var(--danger)':'inherit'}">${r.abandoned||'—'}</td>
      <td>${r.id?dossierBtn('inspector', r.id):''}</td>
    </tr>`).join('')}</tbody></table></div></div>`
  + daysPanel(days.slice(0,50));
}

function timeline(d){
  if(!d) return;
  let html='<table><thead><tr><th>שעה</th><th>אירוע</th><th>מוסד</th><th>פירוט</th><th>משך</th></tr></thead><tbody>';
  d.visits.forEach((v,i)=>{
    if(i>0){
      const p=d.visits[i-1];
      const tr=(p.end&&v.arrive)?Math.max(0,(v.arrive-p.end)/1000):null;
      html+=`<tr style="background:var(--gold-light)">
        <td class="num-cell">${clock(new Date(p.end))}</td><td>נסיעה</td>
        <td colspan="2" style="color:var(--gold-dark)">${esc(p.institution)} ← ${esc(v.institution)}</td>
        <td class="num-cell">${fmtHM(tr)}</td></tr>`;
    }
    html+=`<tr><td class="num-cell">${clock(new Date(v.arrive))}</td>
      <td><strong>הגעה</strong></td><td>${esc(v.institution)}</td>
      <td>${v.n} בדיקות${v.flags?' · <span class="pill p-flag">'+v.flags+' חריגות</span>':''}</td>
      <td class="num-cell">${fmtHM((v.end-v.arrive)/1000)}</td></tr>`;
    v.checks.forEach(c=>{
      html+=`<tr style="font-size:13px;color:var(--text-muted)">
        <td class="num-cell">${clock(c.close_time)}</td><td>דיווח</td><td></td>
        <td>${esc(c.assistant)} · ${esc(PRES_LABEL[c.presence]||'')} · ${esc(ACT_LABEL[c.activity]||'—')}</td>
        <td class="num-cell">${fmtDur(c.t_report)}</td></tr>`;
    });
  });
  html+='</tbody></table>';
  openModal(d.inspector+' · '+d.date,'ציר זמן מלא',[
    {n:fmtHM(d.span),l:'אורך יום'},{n:d.visits.length,l:'מוסדות'},
    {n:d.checks.length,l:'בדיקות'},{n:fmtHM(d.onSite),l:'במוסדות'},
    {n:fmtHM(d.travel),l:'נסיעה'},{n:fmtHM(d.gap),l:'לא מוסבר'}
  ],html);
}

/* ══════ מפה ══════ */
function daysSince_(d){ return Math.round((Date.now()-new Date(d).getTime())/86400000); }

function coverageData(){
  const C=state.data.checks, I=state.data.institutions.filter(i=>i.active), R=state.data.roster;
  const lastI={}, lastA={};
  /* ההצלבה לפי מזהה ולא לפי שם — ממצא 15. השם נשאר לתצוגה. */
  C.forEach(c=>{
    if(!lastI[c.institution]||c.date>lastI[c.institution]) lastI[c.institution]=c.date;
    const k=nid(c.aid)||c.assistant;
    if(!lastA[k]||c.date>lastA[k]) lastA[k]=c.date;
  });
  const inst=I.map(i=>({...i, last:lastI[i.name]||null,
    days:lastI[i.name]?daysSince_(lastI[i.name]):null,
    n:R.filter(r=>r.institution===i.name).length}))
    .sort((a,b)=>(b.days==null?1e9:b.days)-(a.days==null?1e9:a.days));
  const seen={};
  const ass=R.filter(r=>{ const k=nid(r.aid); if(seen[k])return false; seen[k]=1; return true; })
    .map(r=>{ const k=nid(r.aid);
      return {...r, last:lastA[k]||null, days:lastA[k]?daysSince_(lastA[k]):null}; })
    .sort((a,b)=>(b.days==null?1e9:b.days)-(a.days==null?1e9:a.days));
  return {inst,ass};
}

function ageColor(d){
  if(d==null) return '#dc2626';
  if(d<=14) return '#16a34a';
  if(d<=60) return '#c6a636';
  return '#dc2626';
}
function agePill(d){
  if(d==null) return '<span class="pill p-flag">טרם נבדק</span>';
  if(d<=14) return '<span class="pill p-ok">'+d+' ימים</span>';
  if(d<=60) return '<span class="pill p-review">'+d+' ימים</span>';
  return '<span class="pill p-flag">'+d+' ימים</span>';
}

      <div class="label">נבדקו בשבועיים</div><div class="sub">מוסדות</div></div>
    <div class="kpi"><div class="num">${inst.filter(i=>i.days!=null).length?Math.round(inst.filter(i=>i.days!=null).reduce((s,i)=>s+i.days,0)/inst.filter(i=>i.days!=null).length):'—'}</div>
      <div class="label">ימים מאז בקרה</div><div class="sub">ממוצע למוסד שנבדק</div></div>
  </div>
  <div class="panel"><h3>מפת כיסוי
      <span class="note">צבע המוסד לפי הזמן שעבר מהבקרה האחרונה — אדום = טרם נבדק או מעל 60 יום</span></h3>
    <div style="padding:12px">
      <div class="layer-toggles">

      <div id="map"></div>
      <div class="hint" style="margin-top:8px;line-height:1.6">
        נעיצות הבדיקה מוצגות רק כשנשמרו קואורדינטות. קואורדינטות גולמיות
        נשמרות עד סוף שנת הלימודים ועוד שלושה חודשים${gpsFrom ? ', כלומר מ-' + esc(gpsFrom) + ' ואילך' : ''},

const LAYERS={};
function toggleLayer(k){
  const on=$('#ly-'+k).checked;
  if(!LAYERS[k]||!LAYERS.__map) return;
  on ? LAYERS.__map.addLayer(LAYERS[k]) : LAYERS.__map.removeLayer(LAYERS[k]);
}

function drawCoverMap(inst,C){
  const box=$('#map');
  if(typeof L==='undefined'){
    box.innerHTML='<div class="empty" style="padding-top:150px">ספריית המפה לא נטענה. נדרש חיבור לאינטרנט.</div>';
    return;
  }
  const I=inst.filter(i=>i.lat&&i.lng);
  const map=L.map(box,{scrollWheelZoom:false}).setView(I.length?[I[0].lat,I[0].lng]:[32.084,34.833],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  LAYERS.__map=map;

  I.forEach(i=>{
    const col=ageColor(i.days);
    L.circleMarker([i.lat,i.lng],{radius:8+Math.min(i.n/3,9),color:col,weight:2,
      fillColor:col,fillOpacity:.45})
     .bindPopup('<b>'+esc(i.name)+'</b><br>'+i.n+' שיבוצים<br>'+
       (i.days==null?'<b style="color:#dc2626">טרם נבדק</b>':'בקרה אחרונה: '+i.last+' ('+i.days+' ימים)'))
     .addTo(map);
  });

  const col={ok:'#16a34a',review:'#c6a636',flag:'#dc2626'};
  LAYERS.pins=L.layerGroup(C.map(c=>
    L.circleMarker([c.lat,c.lng],{radius:3.5,color:'#333',weight:.8,
      fillColor:col[c.verdict]||'#6b7280',fillOpacity:.9})
     .bindPopup(`<b>${esc(c.assistant)}</b><br>${esc(c.institution)}<br>${esc(c.date)} · ${esc(c.inspector)}<br>מרחק: ${c.distance} מ׳`)
  ));

  /* fitBounds על מכל שרוחבו עדיין 0 נופל לזום 0 — כל העולם,
     וכל המוסדות על נקודה אחת. מודדים את המכל לפני כל התאמה,
     ומתאימים מחדש בכל אירוע שעשוי לשנות את הגודל. */
  const pts=I.map(i=>[i.lat,i.lng]);
  const fit=()=>{ map.invalidateSize();
    if(pts.length && map.getSize().x > 0)
      map.fitBounds(L.latLngBounds(pts).pad(0.12)); };
  fit();
  setTimeout(fit,150);
  setTimeout(fit,600);
  addEventListener('resize', fit);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fit(); });
}


/* ══════ תיקים ══════
   שלושה סוגים: סייע, מפקח, מוסד. התיק נבנה בשרת — גם כדי שכל
   הפקה תירשם ביומן, וגם כי הוא כולל מה שאינו בדשבורד: שיגורים
   שלא הבשילו, וסירובי כניסה.

   **תיק סייע הוא מה שהולך לשימוע**, ולכן הוא מציג את השרשרת
   המלאה של כל בדיקה ולא רק את התוצאה. ממצא בלי השרשרת שהובילה
   אליו אינו ראיה. */
const DOSSIER_TITLE = { assistant: 'תיק סייע', inspector: 'תיק מפקח', institution: 'תיק מוסד' };

/* ״1 בדיקות״ נראה כמו פלט של מחשב. תיק שהולך לשימוע צריך
   להיקרא כמו מסמך. */
function cnt(n, one, many){ return n===1 ? one : n+' '+many; }

function dossierBtn(kind, id, label){
  /* אותה טבלה שבשרת (DOSSIER_PERMISSIONS): תיק על אדם הוא פעולת
     מנהל. ההסתרה כאן היא נוחות בלבד — האכיפה ב-dossier_. */
  if(kind!=='institution' && state.role!=='admin') return '';
  return '<button class="dossier-btn" data-drill="dossier" data-kind="'+esc(kind)+
         '" data-id="'+esc(id)+'" title="פתיחת תיק מלא">'+(label||'תיק')+'</button>';
}

async function openDossier(kind, id){
  if(!id) return;
  openModal(DOSSIER_TITLE[kind]||'תיק', 'טוען…', [], '<div class="loading">מפיק תיק…</div>');
  try{
    const r = await apiPost({action:'dossier', kind:kind, id:id, days:Math.max(state.days,90)});
    if(!r.ok) throw new Error(r.error);
    drawDossier(r.data);
  }catch(e){
    $('#modal-body').innerHTML='<div class="empty"><div class="ic">⚠</div>'+esc(e.message)+'</div>';
  }
}

function drawDossier(d){
  const T=d.totals, S=d.subject;
  $('#modal-title').textContent=(DOSSIER_TITLE[d.kind]||'תיק')+' · '+S.name;
  $('#modal-sub').textContent=[S.sub, 'מזהה '+S.id, 'מ-'+d.from].filter(Boolean).join(' · ');

  const kpis = d.kind==='inspector'
    ? [{n:T.checks,l:'בדיקות'},{n:T.institutions,l:'מוסדות'},{n:T.flags,l:'חריגות'},
       {n:T.forfeited,l:'ויתורים'},{n:T.abandoned,l:'ננטשו'},
       {n:T.flag_pct===null?'—':T.flag_pct+'%',l:'שיעור חריגה'}]
    : d.kind==='institution'
    ? [{n:T.checks,l:'בדיקות'},{n:T.assistants,l:'סייעים נבדקו'},{n:T.flags,l:'חריגות'},
       {n:T.not_found,l:'לא נמצא'},{n:T.inspectors,l:'מפקחים'},
       {n:T.flag_pct===null?'—':T.flag_pct+'%',l:'שיעור חריגה'}]
    : [{n:T.checks,l:'בדיקות'},{n:T.institutions,l:'מוסדות'},{n:T.flags,l:'חריגות'},
       {n:T.reviews,l:'לבירור'},{n:T.not_found,l:'לא נמצא'},
       {n:T.flag_pct===null?'—':T.flag_pct+'%',l:'שיעור חריגה'}];
  /* אותה מעטפת שבה openModal משתמשת. בלעדיה הכרטיסים נערמים
     זה מתחת לזה במקום להסתדר בשורה. */
  $('#modal-kpis').innerHTML='<div class="mini-kpis">'+kpis.map(k=>
    '<div class="mini"><div class="n">'+esc(String(k.n))+'</div><div class="l">'+
    esc(k.l)+'</div></div>').join('')+'</div>';

  let html='';

  if(d.redacted) html+='<div class="note" style="margin:0 0 14px">'+
    'פרטי תלמידים אינם מוצגים בתיק זה. תיק על אדם מזוהה פתוח למנהל בלבד.</div>';

  // ── רוסטר / סגל ──
  if(S.rows && S.rows.length){
    if(d.kind==='assistant'){
      html+=dosSection('שיבוץ ברוסטר',
        '<table><thead><tr><th>מוסד</th><th>סמל</th><th>סוג</th><th>תלמיד</th>'+
        '<th>כיתה</th><th>שעות</th><th>מצב</th></tr></thead><tbody>'+
        S.rows.map(r=>'<tr><td>'+esc(instName(r.institution_id))+'</td><td class="num-cell">'+
          esc(r.symbol)+'</td><td>'+esc(r.atype)+'</td><td>'+esc(r.student)+'</td><td>'+
          esc(r.klass)+'</td><td class="num-cell">'+esc(String(r.hours))+'</td><td>'+
          (r.active?'פעיל':'<span style="color:var(--danger)">מושבת</span>')+'</td></tr>').join('')+
        '</tbody></table>');
    } else {
      const act=S.rows.filter(r=>r.active).length;
      /* בלי עמודת תלמיד: תיק מוסד אינו מחזיר שמות ילדים. */
      html+=dosSection('סייעים במוסד <span class="note">'+
        cnt(act,'אחד פעיל','פעילים')+' מתוך '+S.rows.length+'</span>',
        '<table><thead><tr><th>שם</th><th>ת.ז</th><th>סוג</th><th>מצב</th>'+
        '<th></th></tr></thead><tbody>'+
        S.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="num-cell">'+esc(r.assistant_id)+
          '</td><td>'+esc(r.atype)+'</td><td>'+
          (r.active?'פעיל':'<span style="color:var(--danger)">מושבת</span>')+'</td><td>'+
          dossierBtn('assistant', r.assistant_id)+'</td></tr>').join('')+
        '</tbody></table>');
    }
  }

  // ── שיגורים שלא הבשילו ──
  if(d.dispatches && d.dispatches.length){
    const un=d.dispatches.filter(x=>x.outcome!=='הגיע');
    if(un.length) html+=dosSection('שיגורים שלא הסתיימו בהגעה <span class="note">'+
      cnt(un.length,'אחד','שיגורים')+' מתוך '+d.dispatches.length+'</span>',
      '<table><thead><tr><th>תאריך</th><th>'+(d.kind==='inspector'?'מוסד':'מפקח')+
      '</th><th>שוגר</th><th>תוצאה</th><th>סיבה</th></tr></thead><tbody>'+
      un.map(x=>'<tr><td style="white-space:nowrap">'+esc(x.date)+'</td><td>'+
        esc(d.kind==='inspector'?x.institution:x.inspector)+'</td>'+
        '<td class="num-cell">'+clock(x.dispatch_time)+'</td>'+
        '<td>'+esc(x.outcome)+'</td><td>'+esc(x.forfeit_reason||'—')+'</td></tr>').join('')+
      '</tbody></table>');
  }

  // ── דיווחים שאינם בדיקה ──
  if(d.other && d.other.length){
    html+=dosSection('דיווחים אחרים',
      '<table><thead><tr><th>תאריך</th><th>סוג</th><th>מפקח</th><th>מוסד</th>'+
      '<th>הערה</th></tr></thead><tbody>'+
      d.other.map(c=>'<tr><td style="white-space:nowrap">'+esc(c.date)+'</td><td>'+
        esc(RECTYPE_LABEL[c.record_type]||c.record_type)+'</td><td>'+esc(c.inspector)+
        '</td><td>'+esc(c.institution)+'</td><td class="wrap">'+esc(c.notes||'—')+
        '</td></tr>').join('')+'</tbody></table>');
  }

  // ── השרשרת המלאה ──
  html+='<h4 class="dos-h">שרשרת הבדיקות <span class="note">'+
    cnt(d.chain.length,'בדיקה אחת','בדיקות')+
    ' · כל אחת מוצגת במלואה: שיגור, הגעה, חשיפה, תשובות ותוצאה</span></h4>';
  html += d.chain.length ? d.chain.map(c=>chainCard(c,d.kind)).join('')
        : '<div class="empty">אין בדיקות בטווח</div>';

  $('#modal-body').innerHTML=html;
}

function dosSection(title, inner){
  return '<h4 class="dos-h">'+title+'</h4><div class="dos-tbl">'+inner+'</div>';
}

function instName(id){
  const i=(state.data.institutions||[]).filter(x=>x.id===id)[0];
  return i?i.name:id;
}

/* כרטיס בדיקה אחת — השרשרת בסדר שקרה בו. */
function chainCard(c, kind){
  const vp = c.verdict==='flag' ? '<span class="pill p-flag">חריגה</span>'
           : c.verdict==='review' ? '<span class="pill p-review">לבירור</span>'
           : '<span class="pill p-ok">תקין</span>';
  const who = kind==='assistant' ? c.institution + ' · ' + c.inspector
            : kind==='inspector' ? c.institution + ' · ' + c.assistant
            : c.assistant + ' · ' + c.inspector;

  const step=(label,val,extra)=> val ? '<div class="cs"><span class="cs-l">'+label+
    '</span><span class="cs-v">'+val+'</span>'+(extra?'<span class="cs-x">'+extra+'</span>':'')+'</div>' : '';

  const texts=[[PRES_LABEL[c.presence]||c.presence, c.presence_text],
               [ACT_LABEL[c.activity]||'', c.activity_text],
               [STUD_LABEL[c.student_status]||'', c.student_text]]
    .filter(x=>x[1]).map(x=>'<div class="cs-note"><b>'+esc(x[0])+':</b> '+esc(x[1])+'</div>').join('');

  return '<div class="chain'+(c.verdict==='flag'?' is-flag':'')+'">'+
    '<div class="chain-top"><div><b>'+esc(c.date)+'</b> · '+esc(who)+
      (c.received_late?' <span class="cs-late">נקלט באיחור</span>':'')+
      (c.auth==='declared'
        ? ' <span class="cs-late" title="הדיווח נוצר כשאימות הסיסמה היה כבוי. זהות המפקח הוצהרה ולא הוכחה.">זהות מוצהרת</span>'
        : '')+'</div>'+vp+'</div>'+

    '<div class="chain-steps">'+
      step('שוגר', clock(c.dispatch_time)) +
      step('הגיע', clock(c.arrival_time),
           c.seconds_travel ? fmtHM(c.seconds_travel*1000)+' נסיעה' : '') +
      step('מרחק', c.distance_m+' מ׳',
           c.gps_accuracy_m ? 'דיוק '+c.gps_accuracy_m+' מ׳' : '') +
      step('נחשף', clock(c.reveal_time), c.reveal_seq ? 'חשיפה '+c.reveal_seq : '') +
      step('דיווח', clock(c.close_time),
           c.seconds_report ? fmtHM(c.seconds_report*1000)+' מהחשיפה' : '') +
      step('החתמה', c.attend_in||c.clock_in||'',
           [c.attend_out?'עד '+c.attend_out:'',
            c.in_window===false?'הבדיקה מחוץ למשמרת':''].filter(Boolean).join(' · ')) +
    '</div>'+

    '<div class="chain-ans">'+
      '<div><span class="cs-l">סייע</span> '+esc(c.assistant)+
        ' <span class="cs-x">'+esc(c.assistant_id)+' · '+esc(c.atype)+'</span></div>'+
      (c.student?'<div><span class="cs-l">תלמיד</span> '+esc(c.student)+
        (c.klass?' · '+esc(c.klass):'')+'</div>':'')+
      '<div><span class="cs-l">נמצא</span> '+esc(PRES_LABEL[c.presence]||c.presence||'—')+'</div>'+
      (c.activity?'<div><span class="cs-l">פעילות</span> '+esc(ACT_LABEL[c.activity]||c.activity)+'</div>':'')+
      (c.student_status?'<div><span class="cs-l">מצב התלמיד</span> '+
        esc(STUD_LABEL[c.student_status]||c.student_status)+'</div>':'')+
      '<div><span class="cs-l">אימות</span> '+
        esc(c.verified_name||'—')+' <span class="cs-x">'+esc(VER_LABEL[c.verified_by]||c.verified_by||'')+'</span></div>'+
    '</div>'+
    (texts||c.notes ? '<div class="chain-notes">'+texts+
      (c.notes?'<div class="cs-note"><b>הערה:</b> '+esc(c.notes)+'</div>':'')+'</div>' : '')+
  '</div>';
}

/* ══════ הגדרות ══════
   כל שדה עם הסבר, טווח קשיח וטווח מומלץ. האכיפה בשרת:
   ערך מחוץ לטווח נדחה עם הסבר, וכל שינוי נרשם ביומן עם הערך
   הקודם והחדש. כאן זו רק תצוגה — שדה שנשלח מכאן ואינו בטבלת
   השרת יידחה. */
let CFGCACHE=null;

/* ══════ ביקורת — ההסגר ויומן הגישה ══════

   **ממצא 18':** דיווח שנדחה סופית הגיע להסגר ולא הופיע בשום מסך,
   ולא הייתה לו דרך חזרה. **A13:** היומן נכתב היטב ואיש לא קרא
   אותו. שני הכשלים הם אותו כשל: מידע שנשמר ואינו נראה. */
let AUDITDAYS = 7, AUDITONLY = '';

async function renderAudit(){
  $('#content').innerHTML='<div class="loading">טוען…</div>';
  try{
    const [q,a] = await Promise.all([
      apiPost({action:'quarantinelist', days:90}),
      apiPost({action:'auditlog', days:AUDITDAYS, only:AUDITONLY})
    ]);
    if(!q.ok) throw new Error(q.error);
    if(!a.ok) throw new Error(a.error);
    W.quar=q.data; W.audit=a.data;
    drawAudit();
  }catch(e){
    $('#content').innerHTML='<div class="panel"><div class="empty"><div class="ic">⚠</div>'+
      esc(e.message)+'</div></div>';
  }
}

function drawAudit(){
  $('#content').innerHTML = quarPanel() + auditPanel();
}

function quarPanel(){
  const Q=W.quar, rows=Q.rows||[];
  const open=rows.filter(r=>!r.released_at);
  if(!rows.length) return '<div class="panel"><h3>הסגר'+
    '<span class="note">דיווחים שהשרת דחה סופית</span></h3>'+
    '<div class="empty"><div class="ic">✓</div>אין דיווחים בהסגר</div></div>';

  return '<div class="panel"><h3>הסגר '+
    '<span class="note">'+open.length+' ממתינים · '+(rows.length-open.length)+' שוחררו · '+
    'הראיה שמורה, ולא הגיעה ללשונית הבדיקות</span></h3>'+
    '<div class="body" style="max-height:460px;overflow:auto"><table><thead><tr>'+
    '<th>נקלט</th><th>מפקח</th><th>סוג</th><th>סיבת הדחייה</th><th>ערכים</th><th>מצב</th><th></th>'+
    '</tr></thead><tbody>'+rows.map((r,i)=>
      '<tr><td class="num-cell">'+esc(String(r.received_at).slice(0,16).replace('T',' '))+'</td>'+
      '<td>'+esc(r.inspector)+'</td><td>'+esc(RECTYPE_LABEL[r.record_type]||r.record_type)+'</td>'+
      '<td style="max-width:280px">'+esc(r.reason)+'</td>'+
      '<td style="font-size:12px;color:var(--text-muted)">'+
        (r.values ? Object.keys(r.values).filter(k=>r.values[k])
            .map(k=>esc(k)+'='+esc(r.values[k])).join(' · ') : '—')+'</td>'+
      '<td>'+(r.released_at
        ? '<span class="pill p-ok" title="'+esc(r.released_by+' · '+r.released_fix)+'">שוחרר</span>'
        : '<span class="pill p-flag">ממתין</span>')+'</td>'+
      '<td>'+(r.released_at?'':'<button class="chip" onclick="releaseQuar('+i+')">שחרר</button>')+'</td>'+
      '</tr>').join('')+'</tbody></table></div></div>';
}

/* הדלת אינה עוקפת אימות: הערך המתוקן עובר בכל הבדיקות של save_
   כאילו הדיווח הגיע עכשיו מהשטח, והרשומה נושאת סימון. */
async function releaseQuar(i){
  const r=W.quar.rows[i];
  const fixable=(W.quar.fixable||[]);
  const cur=r.values||{};
  const field=prompt('שחרור דיווח '+r.local_id+'\n\n'+
    'סיבת הדחייה: '+r.reason+'\n\n'+
    'איזה שדה לתקן? השאר ריק כדי לשחרר כמות שהוא.\n'+
    'אפשריים: '+fixable.join(', ')+'\n'+
    'ערכים נוכחיים: '+fixable.map(k=>k+'='+(cur[k]||'')).join(' · '));
  if(field===null) return;
  const fix={};
  if(String(field).trim()){
    const k=String(field).trim();
    if(fixable.indexOf(k)===-1){ flash('שדה שאינו ניתן לתיקון: '+k, true); return; }
    const v=prompt('ערך חדש ל-'+k+'\nנוכחי: '+(cur[k]||'(ריק)'));
    if(v===null) return;
    fix[k]=v;
  }
  try{
    const res=await apiPost({action:'quarantinerelease', local_id:r.local_id, fix:fix});
    if(!res.ok) throw new Error(res.error);
    flash(res.data.result && res.data.result.duplicate
      ? 'הדיווח כבר קיים בלשונית הבדיקות'
      : 'שוחרר ונשמר'+(res.data.applied.length?' · '+res.data.applied.join(' | '):''));
    renderAudit();
  }catch(e){ flash('השחרור נכשל: '+e.message, true); }
}

function auditPanel(){
  const A=W.audit, T=A.totals;
  const chip=(d,l)=>'<button class="chip'+(AUDITDAYS===d&&!AUDITONLY?' active':'')+
    '" onclick="auditRange('+d+')">'+l+'</button>';
  const filt=(k,l)=>'<button class="chip'+(AUDITONLY===k?' active':'')+
    '" onclick="auditFilter(\''+k+'\')">'+l+'</button>';

  let html='<div class="panel"><h3>יומן גישה '+
    '<span class="note">'+T.rows+' רשומות · '+T.denied+' נדחו · '+T.errors+' שגיאות · '+
    T.declared+' בזהות מוצהרת · מ-'+esc(A.from)+'</span></h3><div class="body">'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'+
      chip(1,'יום')+chip(7,'שבוע')+chip(30,'חודש')+
      '<span style="width:12px"></span>'+
      filt('','הכל')+filt('denied','נדחו')+filt('error','שגיאות')+filt('declared','זהות מוצהרת')+
    '</div>';

  if(T.denied) html+='<div class="warn-strip" style="margin-bottom:12px">⚠ '+T.denied+
    ' ניסיונות שנדחו בהרשאה. רשומת דחייה היא הסימן היחיד להתחזות.</div>';

  /* חמש דחיות ביום הן רעש; חמישים בשתי דקות הן סריקה. הצפיפות
     היא הסימן, לא המספר. */
  const B=T.burst||{n:0};
  if(B.n>=10) html+='<div class="warn-strip" style="margin-bottom:12px">⚠ צרור: '+
    B.n+' דחיות בתוך שתי דקות, '+esc(String(B.from).slice(11,16))+'–'+
    esc(String(B.to).slice(11,16))+'. בדוק אם יש באותו חלון שורה אחת עם ok.</div>';

  if(T.claimed.length) html+='<div class="warn-strip" style="margin-bottom:12px">⚠ מזהים '+
    'שהוצהרו ולא הוכחו: '+T.claimed.map(c=>esc(c.k)+' ('+c.n+')').join(' · ')+'</div>';

  /* התווית באה מהלקוח ולכן אינה נאמנה — היא מוצגת לצד המניין
     ואינה מחסירה ממנו. */
  if(T.probes&&T.probes.length) html+='<div class="note" style="margin-bottom:12px">'+
    'תוויות בדיקה בטווח: '+T.probes.map(c=>esc(c.k)+' ('+c.n+')').join(' · ')+
    ' — תווית מהלקוח, אינה ראיה ואינה מופחתת מהמניין.</div>';

  html+='<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">'+
    'לפי פעולה: '+T.by_action.map(x=>esc(x.k)+' '+x.n).join(' · ')+'</div>';

  html+='</div><div class="body" style="max-height:520px;overflow:auto;border-top:1px solid var(--border)">'+
    '<table><thead><tr><th>זמן</th><th>מי</th><th>אימות</th><th>פעולה</th>'+
    '<th>תוצאה</th><th>יעד</th><th>פרטים</th></tr></thead><tbody>'+
    A.rows.map(r=>'<tr>'+
      '<td class="num-cell" style="white-space:nowrap">'+esc(String(r.ts).slice(0,19).replace('T',' '))+'</td>'+
      '<td>'+esc(r.name||'—')+'<span class="cs-x" style="font-size:11px"> '+esc(r.inspector_id)+'</span></td>'+
      '<td>'+(r.auth==='declared'
        ? '<span class="pill p-flag">מוצהרת</span>'
        : '<span style="color:var(--text-muted);font-size:12px">'+esc(r.auth||'—')+'</span>')+'</td>'+
      '<td>'+esc(r.action)+'</td>'+
      '<td>'+(r.outcome==='ok'?'<span class="pill p-ok">ok</span>'
             :r.outcome==='denied'?'<span class="pill p-flag">נדחה</span>'
             :'<span class="pill p-review">'+esc(r.outcome)+'</span>')+'</td>'+
      '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">'+esc(r.target)+'</td>'+
      '<td style="max-width:320px;font-size:12px;color:var(--text-muted)">'+esc(r.detail)+'</td>'+
      '</tr>').join('')+'</tbody></table>';

  if(A.truncated) html+='<div class="note" style="padding:10px 14px">'+
    'עוד '+A.truncated+' רשומות בטווח אינן מוצגות. צמצם את הטווח או סנן.</div>';

  return html+'</div></div>';
}

function auditRange(d){ AUDITDAYS=d; AUDITONLY=''; renderAudit(); }
function auditFilter(k){ AUDITONLY=k; renderAudit(); }

async function renderConfig(){
  $('#content').innerHTML='<div class="loading">טוען הגדרות…</div>';
  try{
    const r=await apiPost({action:'settings'});
    if(!r.ok) throw new Error(r.error);
    CFGCACHE=r.data;
    drawConfig();
  }catch(e){
    $('#content').innerHTML='<div class="panel"><div class="empty"><div class="ic">⚠</div>'+
      esc(e.message)+'</div></div>';
  }
}

function drawConfig(){
  const F=CFGCACHE.fields;
  const warned=F.filter(f=>f.key&&f.warn).length;
  let html='<div class="panel"><h3>הגדרות המערכת'+
    '<span class="note">כל שינוי נרשם ביומן עם הערך הקודם והחדש · '+
    'ערך מחוץ לטווח נדחה בשרת</span></h3><div class="body">';

  if(warned) html+='<div class="warn-strip" style="margin-bottom:14px">⚠ '+
    (warned===1 ? 'ערך אחד מחוץ לטווח המומלץ. הוא פעיל'
                : warned+' ערכים מחוץ לטווח המומלץ. הם פעילים')+
    ' — בדוק שזה מכוון.</div>';

  F.forEach(f=>{
    if(!f.key){ html+='<h4 class="cfg-group">'+esc(f.group)+'</h4>'; return; }
    const range=f.type==='bool' ? '' :
      'טווח מותר '+f.min+'–'+f.max+(f.unit?' '+esc(f.unit):'')+
      ' · מומלץ '+f.lo+'–'+f.hi;
    html+='<div class="cfg-row'+(f.warn?' is-warn':'')+'">'+
      '<div class="cfg-main">'+
        '<div class="cfg-label">'+esc(f.label)+
          (f.readonly?'<span class="cfg-lock">קריאה בלבד</span>':'')+
          (f.is_default?'<span class="cfg-def">ברירת מחדל</span>':'')+
          (f.warn?'<span class="cfg-warn">מחוץ למומלץ</span>':'')+'</div>'+
        '<div class="cfg-help">'+esc(f.help)+'</div>'+
        (range?'<div class="cfg-range">'+esc(range)+'</div>':'')+
      '</div>'+
      '<div class="cfg-edit">'+
        (f.readonly
          ? '<span class="cfg-ro">'+esc(
              f.type==='bool' ? (/^(true|כן|1|v|yes)$/i.test(String(f.value).trim()) ? 'דלוק' : 'כבוי')
                              : f.value)+'</span>'
          : '<input class="cfg-input" id="cfg-'+esc(f.key)+'" value="'+esc(f.value)+'">'+
            '<button class="cfg-save" data-cfg="'+esc(f.key)+'">שמור</button>')+
        (f.unit&&!f.readonly?'<span class="cfg-unit">'+esc(f.unit)+'</span>':'')+
      '</div>'+
    '</div>';
  });
  html+='</div></div>'+
    '<div class="panel"><h3>מה אינו כאן</h3><div class="body cfg-help" style="padding:14px 16px">'+
    'מפתח הגישה אינו מוצג ואינו ניתן לעריכה מכאן — הוא יושב בקוד בלבד.<br>'+
    'אימות הסיסמה נשלט מלשונית המשתמשים, שבה הכיבוי דורש אישור מפורש בכתב.<br>'+
    'ניהול המשתמשים הוא לשונית עצמאית ואינו חלק ממסך זה.'+
    '</div></div>';
  $('#content').innerHTML=html;

  $$('.cfg-save').forEach(b=>b.addEventListener('click',()=>saveSetting(b.dataset.cfg)));
}

async function saveSetting(key){
  const el=$('#cfg-'+key);
  if(!el) return;
  const btn=document.querySelector('.cfg-save[data-cfg="'+key+'"]');
  const was=btn.textContent;
  btn.disabled=true; btn.textContent='שומר…';
  try{
    const r=await apiPost({action:'setsetting', setting:key, value:el.value});
    if(!r.ok) throw new Error(r.error);
    if(r.data.unchanged) flash('לא היה שינוי');
    else if(r.data.warn) flash(r.data.warn+' — נשמר', true);
    else flash('נשמר: '+r.data.before+' ← '+r.data.value);
    await renderConfig();
  }catch(e){
    flash(e.message, true);
    btn.disabled=false; btn.textContent=was;
  }
}

/* ══════ ניהול משתמשים ══════ */
/**
 * סיבוב שרת ל-Apps Script עולה כ-3.5 שניות. לכן הלשונית מרנדרת
 * מהמטמון, ופונה לשרת רק כשהמטמון ריק או בוטל אחרי שינוי.
 * רענון ברקע היה דורס שדות שהמנהל מקליד בהם — לכן אינו אוטומטי.
 */
async function renderUsers(){
  if(!W.users) return refreshUsers();

  drawUsers();                              // מיידי מהמטמון

  // מצב הנעילה משתנה בזמן אמת, ולכן תמיד מאמתים ברקע.
  // הציור מחדש נעשה רק כשבטוח — אחרת נדרוס שדה שמקלידים בו.
  try{
    const r=await apiPost({action:'users'});
    if(!r.ok) return;
    W.users=r.data;
    if(usersTableIsIdle_()) drawUsers();
    else markUsersStale_();
  }catch(e){ /* אין רשת — נשארים עם המטמון */ }
}

/** האם בטוח לצייר מחדש: אין פוקוס בטבלה ואין סיסמה שהוקלדה */
function usersTableIsIdle_(){
  const tbl=document.querySelector('.users-table');
  if(!tbl) return true;
  if(tbl.contains(document.activeElement)) return false;
  return ![...tbl.querySelectorAll('input[type=password]')].some(i=>i.value);
}

function markUsersStale_(){
  const n=document.querySelector('.rules-note');
  if(n && !n.querySelector('.stale-flag'))
    n.insertAdjacentHTML('beforeend',
      ' <span class="stale-flag" style="color:var(--gold-dark);font-weight:600">' +
      '· יש עדכון מהשרת — לחץ ״רענן״ כשתסיים</span>');
}

async function refreshUsers(){
  $('#content').innerHTML='<div class="loading">טוען משתמשים…</div>';
  try{
    const r=await apiPost({action:'users'});
    if(!r.ok) throw new Error(r.error);
    W.users=r.data;
    drawUsers();
  }catch(e){
    W.users=null;
    $('#content').innerHTML='<div class="panel"><div class="empty"><div class="ic">⚠</div>'+esc(e.message)+'</div></div>';
  }
}

async function saveUser(i){
  const u=W.users.users[i];
  const payload={ action:'setuser', inspector_id:u.id,
    username: $('#u-name-'+i).value.trim(),
    role: $('#u-role-'+i).value,
    active: $('#u-act-'+i).checked ? 'true' : 'false' };
  const pw=$('#u-pass-'+i).value;
  if(pw) payload.password=pw;
  try{
    const r=await apiPost(payload);
    if(!r.ok) throw new Error(r.error);
    invalidateUsers(); await refreshUsers();
    flash('נשמר: '+u.name);
  }catch(e){ flash('שגיאה: '+e.message, true); }
}

async function addUser(){
  const name=$('#new-name').value.trim(), pw=$('#new-pass').value;
  if(!name){ flash('חסר שם', true); return; }
  if(pw && pw.length<8){ flash('סיסמה קצרה מדי — 8 תווים לפחות', true); return; }
  try{
    const r=await apiPost({action:'adduser', name:name, gender:$('#new-gender').value,
      username:$('#new-user').value.trim(), password:pw, role:$('#new-role').value});
    if(!r.ok) throw new Error(r.error);
    invalidateUsers(); await refreshUsers();
    flash('נוסף: '+name+' ('+r.data.id+')');
  }catch(e){ flash('שגיאה: '+e.message, true); }
}

async function resetPass(i){
  const u=W.users.users[i];
  if(!confirm('לאפס את הסיסמה של '+u.name+'?\n\nהוא לא יוכל להיכנס עד שתגדיר לו סיסמה חדשה.')) return;
  try{
    const r=await apiPost({action:'setuser', inspector_id:u.id, clear_password:'true'});
    if(!r.ok) throw new Error(r.error);
    invalidateUsers(); await refreshUsers(); flash('הסיסמה של '+u.name+' אופסה');
  }catch(e){ flash('שגיאה: '+e.message, true); }
}

async function unlockUser(i){
  const u=W.users.users[i];
  if(!u.username){ flash('למשתמש אין שם משתמש'); return; }
  try{
    const r=await apiPost({action:'unlockuser', username:u.username});
    if(!r.ok) throw new Error(r.error);
    invalidateUsers(); await refreshUsers();
    flash(r.data.unlocked ? (u.name+' שוחרר') : (r.data.note||'לא נמצאה נעילה'));
  }catch(e){ flash('השחרור נכשל: '+e.message); }
}

/* ממצא 12': התקרה החזירה "פנה למנהל כדי להמשיך" ולמנהל לא הייתה
   פעולה כזו. השחזור היחיד היה עריכת עמודת status בגיליון ידנית —
   בדיוק הפעולה שהמערכת מנסה למנוע. */
async function resetUnmatured(i){
  const u=W.users.users[i];
  if(!confirm('לשחרר את תקרת היעדים של '+u.name+' להיום?\n\n'+
              'השיגורים שלא הסתיימו בהגעה יסומנו "שוחרר בידי מנהל".\n'+
              'הם נשארים בתיק ובפאנלים — רק הספירה מול התקרה מתאפסת.')) return;
  try{
    const r=await apiPost({action:'resetunmatured', inspector_id:u.id});
    if(!r.ok) throw new Error(r.error);
    flash(r.data.cleared ? (u.name+' — שוחררו '+r.data.cleared+' יעדים')
                         : (u.name+' — לא נמצאו יעדים לשחרור'));
  }catch(e){ flash('השחרור נכשל: '+e.message, true); }
}

/* A11: הטוקן חי 14 שעות בלי אימות חוזר ובלי קשירה למכשיר.
   עד כה הדרך היחידה לנתק הייתה שינוי סיסמה — שגם חוסם את
   המפקח עצמו. הניתוק הוא לכל מכשירי המשתמש: הסשן אינו נושא
   מזהה מכשיר. */
async function logoutUser(i){
  const u=W.users.users[i];
  if(!confirm('לנתק את כל המכשירים של '+u.name+'?\n\n'+
              'הסיסמה אינה משתנה — הוא יוכל להתחבר מיד ממכשיר אחר.')) return;
  try{
    const r=await apiPost({action:'logoutuser', inspector_id:u.id});
    if(!r.ok) throw new Error(r.error);
    flash(r.data.logged_out ? (u.name+' — נותקו '+r.data.logged_out+' חיבורים')
                            : (u.name+' — לא היו חיבורים פעילים'));
  }catch(e){ flash('הניתוק נכשל: '+e.message, true); }
}

async function removeUser(i){
  const u=W.users.users[i];
  if(!confirm('להסיר את '+u.name+'?\n\nאם כבר ביצע בדיקות הוא יושבת ולא יימחק,\nכדי לשמור על תקינות הרשומות.')) return;
  try{
    const r=await apiPost({action:'deluser', inspector_id:u.id});
    if(!r.ok) throw new Error(r.error);
    invalidateUsers(); await refreshUsers();
    flash(r.data.deleted ? (u.name+' נמחק') : (u.name+' הושבת'));
  }catch(e){ flash('שגיאה: '+e.message, true); }
}

async function toggleAuth(on){
  if(on && !confirm('להדליק אימות סיסמה?\n\nמרגע זה כל המפקחים יידרשו להזין שם משתמש וסיסמה.'))
    return;
  /* ממצא 23: הכיבוי התבצע בלחיצה אחת, בלי אישור ובלי תיעוד — והוא
     המסוכן מבין השניים: הוא פותח את פעולות השטח לכל מי שמכיר מזהה
     מפקח. השרת דורש את המחרוזת המדויקת, ולכן זו אינה הגנת ממשק. */
  let confirmText='';
  if(!on){
    confirmText=prompt('כיבוי אימות הסיסמה\n\n' +
      'מרגע זה כל מי שמכיר מזהה מפקח יוכל לקבל יעדים ולדווח, בלי סיסמה.\n' +
      'פעולות ההנהלה יישארו מוגנות.\n\n' +
      'להמשך הקלד: כבה אימות');
    if(confirmText===null) return;
  }
  try{
    const r=await apiPost({action:'setauth', value: on?'true':'false', confirm: confirmText});
    if(!r.ok) throw new Error(r.error);
    invalidateUsers(); await refreshUsers();
    flash(on?'האימות הודלק':'האימות כובה');
  }catch(e){ flash('שגיאה: '+e.message, true); }
}

function flash(msg, bad){
  let el=$('#flash');
  if(!el._init){ el._init=1; }
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:24px;right:50%;transform:translateX(50%);z-index:950;'+
    'padding:12px 22px;border-radius:999px;font-size:14.5px;font-weight:600;color:#fff;'+
    'box-shadow:var(--shadow-lg);background:'+(bad?'var(--danger)':'var(--success)');
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.display='none'; },3000);
  el.style.display='block';
}

/* ═══ אתחול ═══ */
async function boot(){
  try{
    const sv=JSON.parse(sessionStorage.getItem('bakaraDash')||'null');
    // סשן שנשמר בלי טוקן שייך לבורר הישן — אינו תקף יותר
    if(sv&&sv.t){ state.token=sv.t; state.name=sv.n; state.inspectorId=sv.i||null;
                  state.role=sv.r||'admin'; return enter(); }
    if(sv) sessionStorage.removeItem('bakaraDash');
  }catch(e){}

  const btn=$('#btn-login'), err=$('#err');
  btn.disabled=true;

  // מצב האימות נקבע מפורשות ולא מנפילה ב-catch:
  // כשל רשת לא אמור להיראות כמו ״אימות פעיל״.
  let authOn;
  try{
    const m=await apiGet('mode');
    if(!m.ok) throw new Error(m.error||'השרת דחה את הבקשה');
    authOn = !!(m.data && m.data.auth_required);
  }catch(e){
    err.innerHTML='לא ניתן להתחבר לשרת.<br>'+
      '<span style="font-weight:400">'+esc(e.message)+'</span>';
    err.style.display='block';
    return;
  }

  /* הדשבורד עובר במסך סיסמה בשני המצבים.
     כשהאימות כבוי, auth_ במסלול ללא-טוקן סמך על מזהה שהלקוח שולח,
     ובורר שהציג מזהי מנהלים סיפק את החצי השני של צירוף ההתחזות.
     פעולות ההנהלה מחייבות טוקן תמיד, ולכן אין יותר בורר. */
  $('#mode-pass').style.display='';
  btn.disabled=false;
  if(!authOn){
    $('#login-sub').innerHTML='הנהלה בלבד · ' +
      '<span style="color:var(--gold-dark);font-weight:600">אימות הסיסמה כבוי למפקחי שטח, ' +
      'אך הדשבורד מחייב סיסמה תמיד</span>';
  }
  const saved=localStorage.getItem('bakaraDashUser');
  if(saved){ $('#u').value=saved; $('#chk-remember').checked=true; $('#p').focus(); }
  else $('#u').focus();
}

boot();
</script>
