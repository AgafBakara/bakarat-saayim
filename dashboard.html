<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#152350">
<title>בקרת סייעים · דשבורד הנהלה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2b8c7e;--teal-dark:#1f6b60;--teal-light:#e8f5f2;
  --gold:#c6a636;--gold-dark:#8a6d10;--gold-light:#faf3dd;
  --navy:#152350;--navy-light:#e7eaf3;
  --bg:#f5f7fa;--surface:#fff;--border:#e1e5eb;
  --text:#1f2937;--text-muted:#6b7280;
  --success:#16a34a;--success-light:#dcfce7;
  --danger:#dc2626;--danger-light:#fee2e2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 4px 20px rgba(0,0,0,.12);
  --radius:12px;--radius-sm:8px;--radius-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none}
input,select{font-family:inherit;font-size:inherit}

.app-header{background:linear-gradient(135deg,var(--navy) 0%,#1e3270 100%);color:#fff;padding:16px 24px;
  box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1240px;margin:0 auto}
.app-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-btn{background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500}
.header-btn:active{background:rgba(255,255,255,.25)}
.container{max-width:1240px;margin:0 auto;padding:20px 24px 60px}

.screen{display:none}.screen.active{display:block}
#screen-login .container{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 100px)}
.login-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:34px 26px;width:100%;max-width:400px;text-align:center}
.login-icon{width:68px;height:68px;background:linear-gradient(135deg,var(--navy),#1e3270);border-radius:20px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px;color:#fff}
.login-title{font-size:21px;font-weight:700;color:var(--navy)}
.login-sub{color:var(--text-muted);font-size:14px;margin-bottom:24px}
.field-label{display:block;text-align:right;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:7px}
.form-input,.form-select{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:var(--radius);
  background:var(--surface);text-align:right;font-size:16px}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light)}
.btn-primary{width:100%;background:var(--navy);color:#fff;padding:15px;border-radius:var(--radius);
  font-size:16px;font-weight:600;margin-top:18px}
.btn-primary:active{background:#1e3270}
.btn-primary:disabled{background:#cbd5e1}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--danger-light);color:#7f1d1d;font-size:14px;font-weight:500}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:18px}
.tab{background:none;padding:11px 22px;font-size:15px;font-weight:600;color:var(--text-muted);
  border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--navy);border-bottom-color:var(--teal)}
.switch{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-muted);cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:960px){.split{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border);
  font-size:14px;font-weight:500;color:var(--text-muted);white-space:nowrap;transition:all .15s}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.spacer{flex:1}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow-sm)}
.kpi .num{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .label{font-size:12.5px;color:var(--text-muted);margin-top:5px}
.kpi .sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;opacity:.8}
.kpi.ok .num{color:var(--success)}
.kpi.bad .num{color:var(--danger)}
.kpi.warn .num{color:var(--gold-dark)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden}
.panel h3{font-size:15px;font-weight:700;color:var(--navy);padding:15px 18px;border-bottom:1px solid var(--border)}
.panel .body{padding:6px 0}
.panel .note{font-size:12px;color:var(--text-muted);font-weight:400;margin-right:8px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-size:12px;font-weight:600;color:var(--text-muted);padding:9px 18px;
  border-bottom:1px solid var(--border);white-space:nowrap;background:#fafbfc}
td{padding:11px 18px;border-bottom:1px solid #f1f3f6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfc}
.num-cell{font-variant-numeric:tabular-nums;font-weight:600}

.bar{height:7px;border-radius:999px;background:var(--border);overflow:hidden;min-width:70px}
.bar span{display:block;height:100%;border-radius:999px;background:var(--teal)}
.bar.risk span{background:var(--danger)}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--success-light);color:#14532d}
.p-review{background:var(--gold-light);color:var(--gold-dark)}
.p-flag{background:var(--danger-light);color:#7f1d1d}

.empty{padding:44px 20px;text-align:center;color:var(--text-muted)}
.empty .ic{font-size:40px;opacity:.45;margin-bottom:10px}
.loading{padding:60px;text-align:center;color:var(--text-muted)}

@media (max-width:960px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .container{padding:16px}
  th,td{padding:9px 12px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="title-row">
    <div class="app-title"><span>◆</span><span>בקרת סייעים · דשבורד הנהלה</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="who" style="font-size:13px;opacity:.85"></span>
      <button class="header-btn" id="btn-logout" onclick="logout()" style="display:none">יציאה</button>
    </div>
  </div>
</header>

<section class="screen active" id="screen-login">
  <div class="container">
    <div class="login-card">
      <div class="login-icon">◆</div>
      <div class="login-title">דשבורד הנהלה</div>
      <div class="login-sub">עיריית בני ברק · אגף בקרה</div>
      <label class="field-label" for="u">שם משתמש</label>
      <input class="form-input" id="u" autocapitalize="off" spellcheck="false">
      <label class="field-label" for="p" style="margin-top:14px">סיסמה</label>
      <input class="form-input" id="p" type="password" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="err" id="err"></div>
      <button class="btn-primary" id="btn-login" onclick="doLogin()">כניסה</button>
    </div>
  </div>
</section>

<section class="screen" id="screen-main">
  <div class="container">
    <div class="tabs">
      <button class="tab active" data-t="base" onclick="setTab('base')">מצב קיים</button>
      <button class="tab" data-t="results" onclick="setTab('results')">תוצאות בקרה</button>
    </div>
    <div class="toolbar">
      <div id="range-chips" style="display:flex;gap:10px">
        <button class="chip" data-d="7"  onclick="setRange(7)">7 ימים</button>
        <button class="chip active" data-d="30" onclick="setRange(30)">30 יום</button>
        <button class="chip" data-d="90" onclick="setRange(90)">רבעון</button>
        <button class="chip" data-d="365" onclick="setRange(365)">שנה</button>
      </div>
      <div class="spacer"></div>
      <label class="switch"><input type="checkbox" id="inc-test" onchange="load()">
        <span>הצג גם רשומות בדיקה</span></label>
      <button class="chip" onclick="load()">רענן</button>
    </div>

    <div id="content"><div class="loading">טוען נתונים…</div></div>
  </div>
</section>

<script>
'use strict';

const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby_m54KMPtMeNNlikGUYpCPTRRgWMDQy-3EfsVF0CkwIvmlIk1PaQljq1lJwDmYYk3J/exec'
};

const state = { token:null, name:null, days:30, tab:'base', data:null };

const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

function fmtDur(sec){
  if(!sec) return '—';
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}

async function apiPost(payload){
  const r = await fetch(CONFIG.API_URL, {
    method:'POST', body:JSON.stringify(payload),
    headers:{'Content-Type':'text/plain;charset=utf-8'}
  });
  return r.json();
}
async function apiGet(action, params={}){
  const qs = new URLSearchParams({action, token:state.token||'', ...params});
  const r = await fetch(CONFIG.API_URL + '?' + qs);
  return r.json();
}

/* ── התחברות ── */
async function doLogin(){
  const err = $('#err'), btn = $('#btn-login');
  err.style.display='none';
  btn.disabled=true; btn.textContent='מתחבר...';
  try{
    const r = await apiPost({action:'login', username:$('#u').value.trim(), password:$('#p').value});
    if(!r.ok) throw new Error(r.error);
    if(r.data.role !== 'admin') throw new Error('משתמש זה אינו מורשה לדשבורד ההנהלה');
    state.token = r.data.token; state.name = r.data.name;
    sessionStorage.setItem('bakaraDash', JSON.stringify({t:state.token, n:state.name}));
    enter();
  }catch(e){
    err.textContent = e.message || 'ההתחברות נכשלה';
    err.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent='כניסה';
    $('#p').value='';
  }
}

function enter(){
  $('#who').textContent = state.name;
  $('#range-chips').style.visibility='hidden';
  $('#btn-logout').style.display='';
  $('#screen-login').classList.remove('active');
  $('#screen-main').classList.add('active');
  load();
}

function logout(){
  state.token=null;
  sessionStorage.removeItem('bakaraDash');
  location.reload();
}

function setRange(d){
  state.days = d;
  document.querySelectorAll('.chip[data-d]').forEach(c=>c.classList.toggle('active', Number(c.dataset.d)===d));
  load();
}

function setTab(t){
  state.tab = t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.t===t));
  $('#range-chips').style.visibility = (t==='results') ? 'visible' : 'hidden';
  if(state.data) render();
}

/* ── טעינה ── */
async function load(){
  $('#content').innerHTML = '<div class="loading">טוען נתונים…</div>';
  try{
    const r = await apiGet('dashboard', {days:state.days, test:$('#inc-test').checked?'true':'false'});
    if(!r.ok) throw new Error(r.error);
    state.data = r.data;
    render();
  }catch(e){
    $('#content').innerHTML = '<div class="panel"><div class="empty"><div class="ic">⚠</div>'+esc(e.message)+'</div></div>';
  }
}

/* ── תצוגה ── */
function render(){
  if(state.tab==='base') return renderBase();
  return renderResults();
}

/* ═══════ מסך א׳: מצב קיים ═══════ */
function renderBase(){
  const I = state.data.institutions.filter(i=>i.active);
  const R = state.data.roster;
  const T = state.data.totals;

  const boys  = I.filter(i=>i.kind==='M').length;
  const girls = I.filter(i=>i.kind==='F').length;
  const noGeo = I.filter(i=>!i.geo).length;
  const cost  = R.reduce((s,r)=>s+r.cost,0);
  const bonus = R.filter(r=>r.bonus).length;

  const kpis = `
  <div class="kpi-row">
    <div class="kpi"><div class="num">${I.length}</div><div class="label">מוסדות פעילים</div>
      <div class="sub">${boys} בנים · ${girls} בנות וגנים</div></div>
    <div class="kpi ok"><div class="num">${R.length}</div><div class="label">סייעים ברוסטר</div>
      <div class="sub">${new Set(R.map(r=>r.aid)).size} אנשים שונים</div></div>
    <div class="kpi"><div class="num">${new Set(R.filter(r=>r.student).map(r=>r.student)).size}</div>
      <div class="label">תלמידים מזוכים</div><div class="sub">לפי שם תלמיד ברוסטר</div></div>
    <div class="kpi warn"><div class="num">${bonus}</div><div class="label">מקבלי מענק התמדה</div>
      <div class="sub">${pct(bonus,R.length)}% מהרוסטר · דגימה מוגברת</div></div>
    <div class="kpi ${cost?'':'warn'}"><div class="num">${cost?(cost/1000).toFixed(0)+'K':'—'}</div>
      <div class="label">עלות חודשית</div>
      <div class="sub">${cost?'כ-'+Math.round(cost*12/1000000*10)/10+' מ׳ ש״ח בשנה':'מלא monthly_cost'}</div></div>
  </div>`;

  const warn = (noGeo || !T.attend_days) ? `
  <div class="panel" style="border-color:#f0dd9e;background:var(--gold-light);margin-bottom:16px">
    <div style="padding:14px 18px;font-size:14px;color:var(--gold-dark);font-weight:500">
      ${noGeo ? '<div>· ' + noGeo + ' מוסדות ללא קואורדינטות — לא יישלח אליהם מפקח. הרץ geocodeInstitutions.</div>' : ''}
      ${!T.attend_days ? '<div>· אין נתוני החתמה בלשונית נוכחות — ההצלבה מול דוח הנוכחות לא תפעל עדיין.</div>' : ''}
    </div></div>` : '';

  $('#content').innerHTML = kpis + warn
    + '<div class="split">' + countPanel(R,'atype','סייעים לפי סוג','מטריצת ההתאמה נגזרת מכאן')
    + countPanel(I,'type','מוסדות לפי סוג','')
    + countPanel(R,'inst_type','סייעים לפי סוג מוסד','איפה מרוכז התקציב') + '</div>'
    + instRosterPanel(I,R);
}

function countPanel(arr,key,title,note){
  const g = group(arr,key);
  const rows = Object.keys(g).map(k=>({k:k,n:g[k].length})).sort((a,b)=>b.n-a.n);
  const tot = arr.length, max = Math.max(...rows.map(r=>r.n),1);
  return `<div class="panel"><h3>${title}${note?' <span class="note">'+note+'</span>':''}</h3>
    <div class="body"><table><tbody>${rows.map(r=>`<tr>
      <td style="width:38%">${esc(r.k)}</td>
      <td class="num-cell" style="width:40px">${r.n}</td>
      <td class="num-cell" style="width:46px;color:var(--text-muted);font-size:12px">${pct(r.n,tot)}%</td>
      <td><div class="bar"><span style="width:${r.n/max*100}%"></span></div></td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

function instRosterPanel(I,R){
  const g = group(R,'institution');
  const rows = I.map(i=>{
    const a = g[i.name] || [];
    const t = {};
    a.forEach(x=>t[x.atype]=(t[x.atype]||0)+1);
    return {name:i.name, kind:i.kind==='M'?'בנים':'בנות/גנים', type:i.type, n:a.length,
            geo:i.geo, det:Object.keys(t).map(k=>k+' '+t[k]).join(' · ') || '—',
            cost:a.reduce((s,x)=>s+x.cost,0)};
  }).sort((a,b)=>b.n-a.n);

  return `<div class="panel"><h3>מוסדות ופריסת סייעים
      <span class="note">מוסד בלי סייעים לא ייכנס להגרלת השיגור</span></h3>
    <div class="body" style="overflow-x:auto"><table><thead><tr>
      <th>מוסד</th><th>מגזר</th><th>סוג</th><th>סייעים</th><th>פירוט</th><th>עלות חודשית</th><th>מיקום</th>
    </tr></thead><tbody>${rows.map(r=>`<tr>
      <td>${esc(r.name)}</td><td style="white-space:nowrap">${r.kind}</td><td style="white-space:nowrap">${esc(r.type)}</td>
      <td class="num-cell" style="color:${r.n?'inherit':'var(--danger)'}">${r.n}</td>
      <td style="font-size:13px;color:var(--text-muted)">${esc(r.det)}</td>
      <td class="num-cell">${r.cost?r.cost.toLocaleString():'—'}</td>
      <td>${r.geo?'<span class="pill p-ok">✓</span>':'<span class="pill p-flag">חסר</span>'}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

/* ═══════ מסך ב׳: תוצאות בקרה ═══════ */
function renderResults(){
  const C = state.data.checks, R = state.data.roster, I = state.data.institutions.filter(i=>i.active);

  if(!C.length){
    $('#content').innerHTML =
      '<div class="panel"><div class="empty"><div class="ic">◷</div>'+
      '<div style="font-weight:600;color:var(--navy);font-size:17px">אין בדיקות בטווח הנבחר</div>'+
      '<div style="margin-top:8px">אם ביצעת בדיקות דרך index-test — סמן למעלה «הצג גם רשומות בדיקה»</div></div></div>';
    return;
  }

  const flags   = C.filter(c=>c.verdict==='flag');
  const reviews = C.filter(c=>c.verdict==='review');
  const avgRep  = C.reduce((s,c)=>s+c.t_report,0)/C.length;
  const covered = new Set(C.map(c=>c.assistant)).size;
  const instCov = new Set(C.map(c=>c.institution)).size;
  const tests   = C.filter(c=>c.is_test).length;

  const kpis = `
  <div class="kpi-row">
    <div class="kpi"><div class="num">${C.length}</div><div class="label">בדיקות שבוצעו</div>
      <div class="sub">${tests?tests+' מתוכן בדיקת מערכת':state.days+' הימים האחרונים'}</div></div>
    <div class="kpi bad"><div class="num">${flags.length}</div><div class="label">חריגות</div>
      <div class="sub">${pct(flags.length,C.length)}% מהבדיקות</div></div>
    <div class="kpi warn"><div class="num">${reviews.length}</div><div class="label">לבדיקה חוזרת</div>
      <div class="sub">${pct(reviews.length,C.length)}% מהבדיקות</div></div>
    <div class="kpi ok"><div class="num">${covered}/${R.length}</div><div class="label">כיסוי סייעים</div>
      <div class="sub">${instCov} מתוך ${I.length} מוסדות נבדקו</div></div>
    <div class="kpi"><div class="num">${fmtDur(avgRep)}</div><div class="label">זמן חשיפה→דיווח</div>
      <div class="sub">ממוצע, דקות</div></div>
  </div>`;

  $('#content').innerHTML = kpis
    + '<div class="grid2">' + inspectorPanel(C) + institutionResultPanel(C,I) + '</div>'
    + '<div class="grid2">' + activityPanel(C) + typePanel(C) + '</div>'
    + recentPanel(C);
}

function institutionResultPanel(C,I){
  const g = group(C,'institution');
  const checked = Object.keys(g).map(k=>{
    const a=g[k], f=a.filter(c=>c.verdict==='flag').length;
    return {name:k, n:a.length, f:f, rate:pct(f,a.length),
            status: f===0?'עבר':(f/a.length>0.25?'נכשל':'ממצאים')};
  }).sort((x,y)=>y.rate-x.rate || y.n-x.n);

  const never = I.filter(i=>!g[i.name]).length;
  const sp = s => s==='עבר' ? '<span class="pill p-ok">עבר</span>'
                : s==='נכשל' ? '<span class="pill p-flag">נכשל</span>'
                : '<span class="pill p-review">ממצאים</span>';

  return `<div class="panel">
    <h3>מוסדות לפי תוצאה <span class="note">${never} מוסדות טרם נבדקו כלל</span></h3>
    <div class="body" style="max-height:420px;overflow-y:auto"><table><thead><tr>
      <th>מוסד</th><th>בדיקות</th><th>חריגות</th><th style="width:100px">שיעור</th><th>סטטוס</th>
    </tr></thead><tbody>${checked.map(r=>`<tr>
      <td>${esc(r.name)}</td><td class="num-cell">${r.n}</td><td class="num-cell">${r.f}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="bar ${r.rate?'risk':''}"><span style="width:${r.rate}%"></span></div>
        <span class="num-cell" style="font-size:12px">${r.rate}%</span></div></td>
      <td>${sp(r.status)}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

function group(arr, key){
  const m = {};
  arr.forEach(x => { const k = x[key] || '—'; (m[k] = m[k] || []).push(x); });
  return m;
}

/* השוואת מפקחים — כולל המדד שמזהה מפקח שלא באמת בודק */
function inspectorPanel(C){
  const g = group(C,'inspector');
  const rows = Object.keys(g).map(k=>{
    const a = g[k];
    const f = a.filter(c=>c.verdict==='flag').length;
    const days = new Set(a.map(c=>c.date)).size;
    return {name:k, n:a.length, perDay:(a.length/Math.max(days,1)).toFixed(1),
            flagRate:pct(f,a.length), avg:a.reduce((s,c)=>s+c.t_report,0)/a.length};
  }).sort((x,y)=>y.n-x.n);

  return `<div class="panel">
    <h3>מפקחים <span class="note">שיעור חריגות חריג לכאן או לכאן שווה בירור</span></h3>
    <div class="body"><table><thead><tr>
      <th>מפקח</th><th>בדיקות</th><th>ליום</th><th>% חריגות</th><th>זמן דיווח</th>
    </tr></thead><tbody>${rows.map(r=>`<tr>
      <td>${esc(r.name)}</td>
      <td class="num-cell">${r.n}</td>
      <td class="num-cell">${r.perDay}</td>
      <td class="num-cell" style="color:${r.flagRate>25?'var(--danger)':r.flagRate===0?'var(--gold-dark)':'inherit'}">${r.flagRate}%</td>
      <td class="num-cell">${fmtDur(r.avg)}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}


const ACT_LABEL = {
  with_student_class:'צמוד לתלמיד בכיתה', with_student_out:'צמוד מחוץ לכיתה',
  nearby_available:'בקרבת התלמיד וזמין', in_class_not_student:'בכיתה, לא עם התלמיד',
  other_students:'מסייע לתלמידים אחרים', teaching:'מלמד כיתה',
  admin:'תפקיד מנהלי', idle:'לא בפעילות', other:'פעילות אחרת'
};
const PRES_LABEL = {
  found:'נמצא', not_found:'לא נמצא', substitute:'ממלא מקום',
  approved:'היעדרות מאושרת', blocked:'לא ניתן לברר'
};

function activityPanel(C){
  const g = group(C,'activity');
  const rows = Object.keys(g).filter(k=>k!=='—')
    .map(k=>({k:ACT_LABEL[k]||k, n:g[k].length}))
    .sort((a,b)=>b.n-a.n);
  const max = Math.max(...rows.map(r=>r.n), 1);

  return `<div class="panel">
    <h3>מה הסייעים עושים בפועל</h3>
    <div class="body"><table><tbody>${rows.map(r=>`<tr>
      <td style="width:52%">${esc(r.k)}</td>
      <td class="num-cell" style="width:44px">${r.n}</td>
      <td><div class="bar"><span style="width:${r.n/max*100}%"></span></div></td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

function typePanel(C){
  const g = group(C,'atype');
  const rows = Object.keys(g).map(k=>{
    const a=g[k], f=a.filter(c=>c.verdict==='flag').length,
          nf=a.filter(c=>c.presence==='not_found').length;
    return {k:k, n:a.length, f:f, nf:nf, rate:pct(f,a.length)};
  }).sort((a,b)=>b.n-a.n);

  return `<div class="panel">
    <h3>לפי סוג סייע <span class="note">איפה מרוכזת הבעיה</span></h3>
    <div class="body"><table><thead><tr>
      <th>סוג</th><th>בדיקות</th><th>לא נמצא</th><th>חריגות</th><th>שיעור</th>
    </tr></thead><tbody>${rows.map(r=>`<tr>
      <td>${esc(r.k)}</td>
      <td class="num-cell">${r.n}</td>
      <td class="num-cell">${r.nf}</td>
      <td class="num-cell">${r.f}</td>
      <td class="num-cell">${r.rate}%</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

function recentPanel(C){
  const rows = C.slice().reverse().slice(0,40);
  const vp = v => v==='flag' ? '<span class="pill p-flag">חריגה</span>'
                : v==='review' ? '<span class="pill p-review">לבדיקה חוזרת</span>'
                : '<span class="pill p-ok">תקין</span>';

  return `<div class="panel">
    <h3>בדיקות אחרונות <span class="note">40 האחרונות</span></h3>
    <div class="body" style="overflow-x:auto"><table><thead><tr>
      <th>תאריך</th><th>מפקח</th><th>מוסד</th><th>סייע</th><th>סוג</th>
      <th>מצב</th><th>פעילות</th><th>אימות</th><th>תוצאה</th>
    </tr></thead><tbody>${rows.map(c=>`<tr>
      <td style="white-space:nowrap">${esc(c.date)}</td>
      <td style="white-space:nowrap">${esc(c.inspector)}</td>
      <td>${esc(c.institution)}</td>
      <td style="white-space:nowrap">${esc(c.assistant)}</td>
      <td style="white-space:nowrap">${esc(c.atype)}</td>
      <td style="white-space:nowrap">${esc(PRES_LABEL[c.presence]||c.presence)}</td>
      <td>${esc(ACT_LABEL[c.activity]||'—')}</td>
      <td style="white-space:nowrap">${esc(c.verified_name||'—')}</td>
      <td>${vp(c.verdict)}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}
